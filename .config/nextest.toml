# CI builds once and runs the tests from an archive on other machines
# (.github/workflows/ci.yml, #633). The compositor's tests start the shell,
# the Settings and `hocus` from beside their own binary, and check against
# each one's list of sources (NAME.d) that it is fresh: the archive takes
# them along.
[profile.default]
archive.include = [
    { path = "debug/hocuspanda-shell", relative-to = "target", on-missing = "error" },
    { path = "debug/hocuspanda-shell.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-settings", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-settings.d", relative-to = "target", on-missing = "error" },
]

# CI's runs. A test that fails by chance is quarantined here, in
# `default-filter` below, while its issue is fixed, so it holds no one; the
# fix takes it out again.
# Run locally, the default profile still runs it. A line of the filter:
#   | (package(CRATE) & test(=MODULE::TEST))   # its issue
# (an integration test is named by its file: `settings_sound::the_test`, in
# its crate's one test binary, `main`.)
[profile.ci]
# A test still running after 3 min is stopped and fails: one that hangs once
# held a pull request's run for more than half an hour (#645).
slow-timeout = { period = "60s", terminate-after = 3 }
# What CI's machines lack (.github/workflows/ci.yml installs neither
# Xwayland, nor a terminal, nor AT-SPI's launcher and Python binding): a
# test fails without the programs it needs, so these are left out there,
# by name, and run where the programs are (the default profile).
# Installing them on CI takes them out of this list.
default-filter = """
not (
    (package(hocus-a11y) & test(=atspi::a_screen_reader_reads_the_tree_and_presses_a_button))
    | (package(hocus-compositor) & (
        test(=decorations::an_x11_window_gets_the_grip_unless_its_motif_hints_ask_for_no_decorations)
        | test(=scales::an_x11_window_on_the_screen_at_2_shows_at_its_size_enlarged)
        | test(=desktop_drop::an_x11_window_moved_by_its_client_let_go_on_a_tile_goes_there)
        | test(=unplug_clients::kitty_keeps_running_on_an_unplugged_screen)
        | test(=unplug_clients::foot_keeps_running_on_an_unplugged_screen)
    ))
)
"""
