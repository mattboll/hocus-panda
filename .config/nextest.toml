# CI builds once and runs the tests from an archive on other machines
# (.github/workflows/ci.yml, #633). The compositor's tests start the shell,
# the Settings, `hocus`, `hocus-transcribe`, `hocus-camera` and `hocus-voice` from beside their own binary, and check against
# each one's list of sources (NAME.d) that it is fresh: the archive takes
# them along.
[profile.default]
archive.include = [
    { path = "debug/hocuspanda-shell", relative-to = "target", on-missing = "error" },
    { path = "debug/hocuspanda-shell.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-settings", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-settings.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-transcribe", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-transcribe.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-camera", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-camera.d", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-voice", relative-to = "target", on-missing = "error" },
    { path = "debug/hocus-voice.d", relative-to = "target", on-missing = "error" },
]

# CI's runs. A test that fails by chance is quarantined here, in
# `default-filter` below, while its issue is fixed, so it holds no one; the
# fix takes it out again (docs/workflow.md, "A test that fails by chance").
# Run locally, the default profile still runs it. A line of the filter:
#   | (package(CRATE) & test(=MODULE::TEST))   # its issue
# (an integration test is named by its file: `settings_sound::the_test`, in
# its crate's one test binary, `main`.)
[profile.ci]
# A test still running after 3 min is stopped and fails: one that hangs once
# held a pull request's run for more than half an hour (#645).
slow-timeout = { period = "60s", terminate-after = 3 }
# Every test runs whatever fails before it: a first failure hid the rest of
# its shard, and the next run found the next one (#769).
fail-fast = false
# One retry: a test that passes at its second try keeps the run green, so
# that no pull request waits on a chance failure, but nextest reports it
# FLAKY in the run's log, and it has failed: weekly-stress lists the week's
# FLAKY tests from CI's logs, and each gets an issue (docs/workflow.md, "A test that fails
# by chance").
# With no retry, chance failures turned a quarter of the runs red
# (28 of 114 from 2026-11-20 to 11-27).
retries = 1
# What CI's machines lack (.github/workflows/ci.yml installs neither
# Xwayland, nor a terminal, nor AT-SPI's launcher and Python binding): a
# test fails without the programs it needs, so these are left out there,
# by name, and run where the programs are (the default profile).
# Installing them on CI takes them out of this list.
# And those that fail by chance on CI's runners, until their issue's fix:
# `bar_windows::the_window_menus_switches_and_tiles_act_on_its_window` (#972), and
# `today::a_line_opens_its_call_else_the_calendar_on_its_event_and_more_
# the_calendar` (#973), and `rain::a_rain_allocates_little_on_the_loop` (#974).
default-filter = """
not (
    (package(hocus-a11y) & test(=atspi::a_screen_reader_reads_the_tree_and_presses_a_button))
    | (package(hocus-compositor) & (
        test(=decorations::an_x11_window_gets_the_grip_unless_its_motif_hints_ask_for_no_decorations)
        | test(=scales::an_x11_window_on_the_screen_at_2_shows_at_its_size_enlarged)
        | test(=desktop_drop::an_x11_window_moved_by_its_client_let_go_on_a_tile_goes_there)
        | test(=memory::x11_windows_gone_leave_no_surface_behind)
        | test(=unplug_clients::kitty_keeps_running_on_an_unplugged_screen)
        | test(=unplug_clients::foot_keeps_running_on_an_unplugged_screen)
        | test(=bar_windows::the_window_menus_switches_and_tiles_act_on_its_window)
        | test(=today::a_line_opens_its_call_else_the_calendar_on_its_event_and_more_the_calendar)
        | test(=rain::a_rain_allocates_little_on_the_loop)
    ))
)
"""

# The Hocuspanda camera's models (#619, lots 3 and 4) measured within a
# budget of the processor's time: one at a time, so that they do not
# share a core with each other (their tests of how they run beside them).
[test-groups]
camera-models = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(hocus-camera) & (test(/^segment::/) | test(/^face::/) | test(/^hands::/) | test(/^wear::/) | test(/^framing::/) | test(/^panda::/))"
test-group = "camera-models"
