# Hocuspanda's configuration: ~/.config/hocuspanda/config.toml (or
# $XDG_CONFIG_HOME/hocuspanda/config.toml). Every setting is listed here
# with its default; uncomment what you change. It is read when the session
# starts; the keyboard, the shortcuts, the pointer, the touchpad, the
# appearance, the locale, the wallpaper, the desktops, the windows and
# the ink sections also as soon as the file changes. A
# file that does not read is refused as a whole, and the
# journal says why: journalctl --user -t hocuspanda -b

# [keyboard]
# XKB layouts, each with its variant in brackets, the first active at
# start, for example ["fr", "fr(bepo)", "us"]. Empty: the system's
# (/etc/default/keyboard, from dpkg-reconfigure keyboard-configuration),
# or else XKB's defaults (us). Options set here win over the system's.
# layouts = []
# XKB options, for example "grp:alt_shift_toggle,caps:escape".
# options = ""
# Milliseconds before a held key repeats, and repeats per second.
# repeat_delay = 200
# repeat_rate = 25
# Num Lock on as the session opens, on every keyboard.
# numlock = false

# [pointer]
# Every mouse, trackball and trackpoint, given these as it is plugged in
# and again when this file changes (the Settings' "Souris et pavé
# tactile"). A value a device cannot take is skipped for that device; a
# value that does not read is logged, and its default applies.
# The pointer's speed, from -1.0 (slow) to 1.0 (fast).
# speed = 0.0
# "adaptive": a quick move goes further; "flat": the same distance at any
# speed.
# acceleration = "adaptive"
# Content follows the wheel, as under a finger.
# natural-scroll = false
# The right button is the main one.
# left-handed = false

# [touchpad]
# Every touchpad, as [pointer].
# speed = 0.0
# One finger taps a click, two a right click, three a middle click.
# tap-to-click = true
# Tap twice and hold the second to drag.
# tap-and-drag = true
# Pressing clicks right "two-fingers" anywhere, or in the bottom right
# "corner". By default, the touchpad's own (libinput's choice for it):
#   right-click = "two-fingers"
# Your palm does not move the pointer while you type.
# disable-while-typing = true
# Content follows your fingers.
# natural-scroll = false
# Scrolling with "two-fingers", or along the right "edge".
# scroll = "two-fingers"
# Off while an external mouse is plugged in.
# off-with-mouse = false
# Three fingers sideways change desktop, following them.
# swipe-desktops = true
# Four fingers up open the launcher, down close it; down with no launcher
# open show the overview, or close it.
# swipe-launcher = true

# [panel]
# The bar: on the primary screen only ("primary"), or on every screen
# ("all").
# screens = "primary"
# The side of every screen the bar stands on: "right" or "left". Its edge
# to click, the room kept for it, its popovers (on its inner side), its
# halo and the panda peeking out go with it; the notifications stay in
# the top right corner.
# side = "right"
# The primary screen, by connector name. Empty: the built-in panel (eDP,
# LVDS, DSI) when it is connected, else the first screen. When it is
# unplugged, the bar goes to a screen still there, and comes back with it.
# output = ""
# The bar's form: "full" (196 px), "mini" (56 px), or "auto": full on a
# screen at least 1796 px wide (logical), mini otherwise, or as last chosen
# there with a click on the bar's outer edge or Super+Shift+B (remembered in
# ~/.local/state/hocuspanda/panel.toml). A screen may have its own, as
# panel-form in its [outputs.NAME] section ("auto" there too): the
# Settings write each screen's, and a form chosen there forgets the one
# chosen with a click. The desktop follows [panel] as the file changes.
# form = "auto"
# The windows of the screen's current desktop over its desktops, the
# focused one first, at most 3 (each with its close button), then "+ N
# more"; in the mini form, an item that lists them. false hides them.
# windows = true
# The groups under the clock; false hides one in both forms (an empty
# group takes no room either): the next meeting's card (its mark in the
# mini form), Today's events after it (the full form only), the to-do
# list, the agents.
# meeting = true
# today = true
# tasks = true
# agents = true
# The order of Today, the to-do list and the agents, under the meeting's
# card and the sign of what is in use; the mini form follows it. A name
# left out comes after those named.
# order = ["today", "tasks", "agents"]

# [panel.clock]
# The clock at the top of the bar. Its font: the bundled "Martian Mono",
# or any installed family by name ("JetBrains Mono"); a family that is not
# installed falls back to Martian Mono. Every digit sits in a cell as wide
# as a "0", so that nothing shifts as the time changes.
# font = "Martian Mono"
# The colour of the hours and minutes, #RRGGBB.
# color = "#EEF1F6"
# What the digits do when the minute changes: "odometer" (the old digit
# leaves upward, the new one comes from below), "roll" (the new one rises
# into place), "flip" (a split-flap), "neon" (it flickers on) or "none".
# Nothing moves with reduced motion, or when the bar draws on the CPU.
# transition = "odometer"
# The seconds beside the minutes, in the full form.
# seconds = true

# Screens, by connector name. Without a scale, a screen takes 1, or 2
# when it is denser than 192 dpi and stays at least 1280x800 at 2 (a
# 15.6-inch 4K panel); never a fraction by itself. The journal names
# each screen as it lights: "output eDP-1 2560x1600@60.00 ... scale 1
# (automatic: 191 dpi)". A scale from 0.5 to 4, for example:
#
#   [outputs.eDP-1]
#   scale = 1
#
#   [outputs.DP-2]
#   scale = 1.25
#   panel-form = "mini"
#
# The Settings' Écrans page writes the rest; the desktop follows the file
# as it changes. A mode, WIDTHxHEIGHT@HZ (without one: the screen's
# preferred size at its highest rate; one it does not offer: the same):
#   mode = "2560x1600@60"
# Its top-left corner, logical pixels; used when every screen on has one
# and they neither overlap nor leave one apart, else left to right:
#   position = [0, 0]
# Turned off, plugged (its windows go to another; the last one stays on):
#   enabled = false
# Variable refresh rate, when the screen offers it:
#   vrr = true
# Its own wallpaper, while [wallpaper] per-screen is true (else picture):
#   wallpaper = "~/.local/share/hocuspanda/wallpapers/Montagne.jpg"
#
# Each set of screens (the screens plugged and on together) keeps its
# own arrangement over the [outputs.NAME] above, which stay what a set
# seen for the first time starts from. A screen is named by its EDID's
# make, model and serial ("DEL U3423WE 7XY1234"), or by its connector
# when it has none; the journal says it as it lights ("a screen, known
# as"). With two screens or more, the Settings' Écrans page writes the
# arrangement there: each screen's mode, position, scale and vrr, and
# the primary screen (over [panel] output):
#
#   [[screen-sets]]
#   screens = ["BOE 0x0BCA (eDP-1)", "DEL U3423WE 7XY1234"]
#   primary = "DEL U3423WE 7XY1234"
#   [screen-sets.outputs."DEL U3423WE 7XY1234"]
#   position = [0, 0]
#   [screen-sets.outputs."BOE 0x0BCA (eDP-1)"]
#   position = [440, 1440]
#   scale = 1.25

# [shortcuts]
# Every shortcut of the desktop: modifiers (Super, Shift, Ctrl, Alt) and
# an XKB key name (Return, E, F1, space...). One shortcut, or a list of
# them, as ["Super+Q", "Alt+F4"]. An empty string or list turns an
# action's off. In a window of another session, Super is Alt+Super, and
# the other session sees Alt+F4 first.
#
# Opens a terminal.
# terminal = "Super+Return"
# Logs out: the session menu asks to confirm (10 s, cancellable), then
# the session ends and the display manager comes back.
# log-out = "Super+Shift+E"
# Locks the session.
# lock = "Super+L"
# Asks the focused window to close (the application may ask first).
# close = ["Super+Q", "Alt+F4"]
# Minimises the focused window; Alt+Tab brings it back.
# minimize = "Super+H"
# The left or right half; again, the other side.
# snap-left = "Super+Left"
# snap-right = "Super+Right"
# Maximises; restores, and on a window already floating, minimises.
# maximize = "Super+Up"
# restore = "Super+Down"
# The quarter on that side, keeping the window's other side.
# quarter-up = "Super+Shift+Up"
# quarter-down = "Super+Shift+Down"
# quarter-left = "Super+Shift+Left"
# quarter-right = "Super+Shift+Right"
# Focuses the window on that side; none by default (Alt+Tab and the
# pointer do it), for example "Super+Alt+Left".
# focus-left = ""
# focus-right = ""
# focus-up = ""
# focus-down = ""
# The windows, the most recently used first, while Alt is held; Tab and
# Shift+Tab move, releasing Alt goes there (nested: Alt+Super+Tab).
# switch-windows = "Alt+Tab"
# switch-windows-backward = "Alt+Shift+Tab"
# The desktop on the left or the right, of the screen under the pointer.
# desktop-left = "Super+Ctrl+Left"
# desktop-right = "Super+Ctrl+Right"
# A desktop by its number (the keys of the top row, on any layout).
# desktop-1 = "Super+1"
# desktop-2 = "Super+2"
# desktop-3 = "Super+3"
# desktop-4 = "Super+4"
# desktop-5 = "Super+5"
# desktop-6 = "Super+6"
# desktop-7 = "Super+7"
# desktop-8 = "Super+8"
# desktop-9 = "Super+9"
# Sends the focused window to a desktop, staying here.
# send-to-desktop-1 = "Super+Shift+1"
# send-to-desktop-2 = "Super+Shift+2"
# send-to-desktop-3 = "Super+Shift+3"
# send-to-desktop-4 = "Super+Shift+4"
# send-to-desktop-5 = "Super+Shift+5"
# send-to-desktop-6 = "Super+Shift+6"
# send-to-desktop-7 = "Super+Shift+7"
# send-to-desktop-8 = "Super+Shift+8"
# send-to-desktop-9 = "Super+Shift+9"
# Takes the focused window to a desktop, going there with it.
# take-to-desktop-1 = "Super+Ctrl+Shift+1"
# take-to-desktop-2 = "Super+Ctrl+Shift+2"
# take-to-desktop-3 = "Super+Ctrl+Shift+3"
# take-to-desktop-4 = "Super+Ctrl+Shift+4"
# take-to-desktop-5 = "Super+Ctrl+Shift+5"
# take-to-desktop-6 = "Super+Ctrl+Shift+6"
# take-to-desktop-7 = "Super+Ctrl+Shift+7"
# take-to-desktop-8 = "Super+Ctrl+Shift+8"
# take-to-desktop-9 = "Super+Ctrl+Shift+9"
# Takes the focused window to the desktop on the left or the right of its
# screen, going there with it; it stays past the first or the last.
# take-to-desktop-left = "Super+Ctrl+Shift+Left"
# take-to-desktop-right = "Super+Ctrl+Shift+Right"
# Sends the focused window to the screen on the left or the right, onto
# the desktop it shows, at the same share of its work area. Nested (in a
# window of another session), these have no default: Super is Alt+Super
# there already.
# move-to-screen-left = "Super+Alt+Left"
# move-to-screen-right = "Super+Alt+Right"
# The bar's other form, on the screen under the pointer.
# toggle-bar = "Super+Shift+B"
# The keyboard into the bar of the focused window's screen, on the agent
# waiting, else the one stuck, else the clock: Tab and the arrows walk its
# items, Enter opens one, Esc goes back a step. Again, the next screen's
# bar, then back to the window (docs/design/bar.md §11).
# focus-bar = "Super+B"
# The launcher, full screen on the screen under the pointer; again, it
# closes (docs/design/launcher.md).
# launcher = "Super+Space"
# The actions palette: every action of the desktop in a list dropping from
# the top of the focused window's screen, searchable; Enter runs one on
# that window, or its screen. Again, it closes (docs/design/actions.md).
# actions = "Super+P"
# The overview: every screen's desktops and windows at once; again, it
# closes (docs/design/windows.md §12b).
# overview = "Super+W"
# The clipboard's history, from the bar of the focused window's screen, its
# search holding the keyboard; again, it closes (docs/design/bar.md, 5.6).
# clipboard = "Super+V"
# The emoji picker, under the focused application's caret; again, it closes
# (docs/design/emoji.md). The key is the one typing `.`, with Shift on
# layouts that need it (AZERTY).
# emoji = "Super+period"
# The secretary's drawer, beside the bar of the focused window's screen;
# again, it closes. In the assistant mode of `[secretary]` only: in the
# classic mode the chord goes to the window (docs/design/secretary.md §4).
# secretary = "Super+S"
# The keyboard's sound and brightness keys: 5 % a press, stepping on while
# held; up stops at 100 %, brightness down at 5 %, so that the screen never
# goes black. A volume key unmutes. Only the bar's gauges show it.
# volume-up = "XF86AudioRaiseVolume"
# volume-down = "XF86AudioLowerVolume"
# mute = "XF86AudioMute"
# brightness-up = "XF86MonBrightnessUp"
# brightness-down = "XF86MonBrightnessDown"
# The screen capture (docs/design/screenshots.md): an area, a window, a
# screen or all of them, chosen on every screen darkened, then copied and
# saved in the pictures' folder ("Screenshots", "Captures d'écran" in
# French).
# capture = "Print"
# The whole screen under the pointer, at once.
# capture-screen = "Shift+Print"
# The focused window, at once.
# capture-window = "Alt+Print"
# Records the screen with the last settings of the capture's Vidéo (an
# area, a window or a screen, the computer's sound, the microphone), after
# a countdown; while recording, stops it. Saved in the videos' folder
# ("Screen recordings", "Enregistrements d'écran" in French).
# record = "Super+Shift+R"
# Joins the meeting whose reminder shows, else the one starting next within
# 10 min, opening its video call (docs/design/bar.md, Day.6).
# join = "Super+J"
# The magnifier (docs/design/accessibility.md): a step in, turning it on at
# its last zoom; a step out, off at 1; off. The keypad's + and - too, for
# layouts where - shares a key with a digit (6 on AZERTY: Super and that
# key zooms out there, it does not go to desktop 6).
# magnifier-in = ["Super+equal", "Super+plus", "Super+KP_Add"]
# magnifier-out = ["Super+minus", "Super+KP_Subtract"]
# magnifier-off = "Super+Escape"
# Starts the screen reader (Orca), or stops it; on the lock screen too
# (docs/design/screen-reader.md).
# screen-reader = "Super+Alt+S"
#
# Fixed for now: Super and a drag moves a window, Super and a right-drag
# resizes it; Super+Alt and the wheel over a window make it more or less
# transparent, by 10 % down to 20 % (kept while it is open, and in the
# session restored); Ctrl+Alt+F1 to F12 switch to another virtual
# terminal.

# [capture]
# Written by the Settings' Captures et presse-papiers page, every key
# followed live (taken by the next capture). Where screenshots are saved:
# empty, the pictures' folder's "Screenshots" ("Captures d'écran" in
# French); else an absolute folder, or one from the home ("~/Bureau"). A
# folder that cannot be written (gone, read-only) is passed over for the
# default one until it can again. Their format, "png" or "jpeg" (quality
# 90; the clipboard always gets PNG). A discreet click as the picture is
# taken, never when the sound is muted.
# folder = ""
# format = "png"
# sound = true

# [recording]
# Screen recordings' format: "mp4" (H.264 and AAC) or "webm" (VP9 and
# Opus). Encoded by ffmpeg, on the GPU through VA-API when it can. Where
# they are saved: empty, the videos' folder's "Screen recordings"
# ("Enregistrements d'écran"); else as [capture] folder. Both followed
# live, taken by the next recording.
# format = "mp4"
# folder = ""

# [clipboard]
# The clipboard's history (Super+V), followed live. Off, nothing new is
# read or kept, the history shows its pinned items only and erases the
# others 6 s later (turned on again within that time, they come back).
# How long what is not pinned is kept, 200 items at most: "session"
# (never on disk), "1d", "7d" or "30d". What a password manager marks
# secret, and what is copied from KeePassXC, Bitwarden, 1Password or the
# applications listed (by their ids), is never kept, unless skip-secrets
# is off.
# history = true
# keep = "30d"
# skip-secrets = true
# ignore = []

# [perf]
# The day's CPU and memory of the compositor and the shell, sampled every
# 10 s on a thread of their own, kept 14 days in
# ~/.local/state/hocuspanda/perf (Settings > Performances, and
# `hocus perf day`). Followed live.
# record = true

# [agents]
# How the bar calls you for the agents (Claude Code, Codex, herdr, and
# what says its state with `hocus agent`), followed live. Which of their
# states light the halo around the bar: "all" (an agent waiting for you,
# stuck, or done and not seen), "waiting" (only an agent waiting for you)
# or "off"; the meetings keep theirs. When an agent still waiting gets one
# more wave, its panda peeking out again: "2m", "5m", "10m" or "never"
# (none while the halo is "off"). For what an agent's panda peeks out of the
# bar for 8 s: "waiting-and-done", "waiting" or "off". Off, the agents'
# rows show a dot of their state's colour instead of their pandas.
# halo = "all"
# remind = "5m"
# peek = "waiting-and-done"
# pandas = true

# [secretary]
# The secretary (docs/design/secretary.md): "classic" is the agents'
# secretary as she is; "assistant" starts her own process, which keeps an
# encrypted memory in ~/.local/share/hocuspanda/secretary (its key in the
# keyring) and reads the sources you consent to. Followed live: back to
# "classic", her process stops and her memory stays on disk until you ask
# her to forget it. What she reads is not listed here: each source is
# consented to on its own (an application's notifications, Slack's for
# one, under Settings › Agents), kept in her folder's consents.json.
# mode = "classic"

# [secretary.models]
# Each role's provider and model, "PROVIDER/MODEL", applied at the next
# request. Claude for what needs understanding; the local model only
# triages (and points at secrets) what arrives.
# answer = "anthropic/claude-sonnet-5-5"
# briefing = "anthropic/claude-sonnet-5-5"
# extraction = "anthropic/claude-sonnet-5-5"
# compaction = "anthropic/claude-sonnet-5-5"
# triage = "local/qwen3:8b"

# [secretary.providers.anthropic]
# No key here: it is in the keyring (hocus-secretary key anthropic).
# kind = "anthropic"
# url = "https://api.anthropic.com"

# [secretary.providers.local]
# A server you run on this machine (Ollama, llama.cpp); the desktop ships
# no weights. "ollama" also unloads the model when the triage is idle;
# "openai" is any OpenAI-compatible endpoint.
# kind = "ollama"
# url = "http://127.0.0.1:11434/v1"

# [secretary.triage]
# On battery, the triage runs only above this charge (%); it pauses while
# the CPU package is above heat (°C); the model is unloaded after
# unload-after idle seconds; pace seconds between two requests.
# battery = 50
# heat = 95
# unload-after = 120
# pace = 2

# [idle]
# How long without input (keyboard, pointer, touchpad) on AC before the
# session is idle, in seconds, from 1 to 86400, or "off". Idle, every
# screen dims for 10 s (any input lifts it), then the session locks, and
# the screens go off [power.ac] screen-off-after later
# (docs/design/idle.md). A video playing or a call (an application holding
# the screen on), and a window in full screen with the focus, hold it off;
# the countdown starts again from zero when they let go. Applications' own
# idle notifications work either way. The Settings' "Assombrir l'écran
# après", on AC, writes it.
# delay = 300

# [power]
# Written by the Settings' Énergie page (docs/design/settings.md), every
# key followed live. Whether the session locks as the dim ends (off: the
# screens go off after it, unlocked) and before the machine sleeps. The
# lid closed: "suspend", "lock", "screen-off" or "nothing"; only the
# laptop's screen off when docked (on AC, another screen on); the power
# button's short press: "ask" (the session menu), "suspend", "power-off"
# or "nothing" (both only when logind leaves them to the desktop). The
# automatic power saver, at or under this battery level (5 to 50 %), on
# battery, through power-profiles-daemon.
# lock-on-idle = true
# lock-before-sleep = true
# lid = "suspend"
# lid-ignored-when-docked = true
# power-button = "ask"
# auto-saver = true
# auto-saver-below = 20

# [power.battery]
# On battery: the dim after this long without input; the screens off this
# long after the lock (or after the dim, locking off); the computer asleep
# after this long without activity. "0s", "10s", "5m", "1h", or "never".
# idle = "3m"
# screen-off-after = "10s"
# suspend-after = "15m"

# [power.ac]
# On AC (the dim's delay is [idle] delay).
# screen-off-after = "30s"
# suspend-after = "never"

# [programs]
# The terminal's command, run through sh -c, for example "foot" or
# "kitty --single-instance". Empty: the first of kitty, foot, alacritty
# and xterm found in PATH.
# terminal = ""

# [session]
# At log in, the applications open at the last log out start again, each
# window back in its place: its screen, desktop, place and state. The
# session is kept in $XDG_STATE_HOME/hocuspanda/session.
# restore = true

# [desktops]
# Desktops on each screen, from 1 to 9. Each screen switches its own.
# Followed as the file changes: more are added after the last, empty;
# fewer take out the last ones, their windows going to the last that
# stays.
# count = 4
# Their names, by position, the same on every screen: the bar's tiles and
# Alt+Tab say them. One missing or "" is "Bureau N" / "Desktop N".
# names = []

# [windows]
# The key held to move a window by a drag anywhere in it: "alt", "super"
# (Super+drag then no longer draws on the screen) or "none" (title bars
# and the grip only). In a window of another session, "super" is
# Alt+Super.
# move-modifier = "alt"
# The key held to resize a window by a right-button drag anywhere in it,
# the edge nearest the pointer following: "super", "alt" or "none" (the
# frame only).
# resize-modifier = "super"
# A moved window's edges stick to other windows' (8 px apart) and to the
# screen's edges within 12 px; drag on to free it.
# magnet = true
# Dragged against a side, a window takes that half; in a corner, a
# quarter; at the top, the whole screen. Super+arrows snap all the same.
# snap-by-drag = true
# A moved window wobbles, then settles (never with reduced motion).
# wobble = true
# How applications' windows (and their dialogs larger than 200 x 200 px)
# open and close: "standard" (grow and fade in 220 ms), "rain" (columns of
# glyphs fall through them, 360 ms to open, 300 ms to close; at most three
# at once, none for the windows of the last session coming back) or
# "frost" (seen through a sheet of ice that thaws to clear glass; the same
# times and rules). With reduced motion or the power
# saver, and drawing on the CPU, the windows fade instead.
# animation = "standard"
# Alt+Tab lists "all" desktops' windows (this one's first) or this
# "desktop"'s only.
# alt-tab = "all"
# Rules per application, in this order, the first of an application's
# applying: its windows open on a desktop (from 1, on the screen they open
# on), at a size ("last", their last size, by default; "maximized",
# "left", "right", "fullscreen"), and above the others (a fullscreen
# window in front covers them). A dialog follows its parent. For example:
#   [[windows.rules]]
#   app-id = "org.gnome.Evolution"
#   desktop = 2
#   size = "maximized"
#   above = false

# [overview]
# The pointer held a moment (150 ms) in a screen's top-left corner opens
# the overview, or closes it, as Super+W does; once each time it enters.
# Not where the bar stands (on the left), nor where another screen touches
# the corner, nor over a fullscreen window or while a button is held.
# hot-corner = true

# [ink]
# Super+drag draws on the screen, Super+Shift+drag an arrow, Super+Alt
# held shows a laser. Off, they do nothing and pass to the window.
# enabled = true

# [magnifier]
# The magnifier (docs/design/accessibility.md): the screen under the
# pointer drawn larger, from 1 to 16 times, by the desktop; screenshots,
# recordings and shared screens stay as they are. Super+= zooms in a step
# (and turns it on, at its last zoom), Super+- out (off at 1), Super+Escape
# turns it off, Super and the wheel zoom by 10 %. On from the start, at
# this zoom:
# enabled = false
# zoom = 2.0
# How the view follows the pointer: "edge" (it moves only when the pointer
# pushes its edge), "centre" (the pointer stays in its middle) or
# "proportional" (it sits where the pointer sits on the screen).
# follow-pointer = "edge"
# The view jumps to what takes the keyboard (a window, the bar's popovers)
# and follows an application's text caret.
# follow-keyboard = true
# Smoothed; off, hard pixels.
# smooth = true

# [night-light]
# Warmer colours in the evening (docs/design/windows.md §14): the screens'
# white made warmer, from `from` to `to` (the clock's hours), fading in
# over 30 min from `from` and out over 30 min from `to`. The same hour
# twice: all day. On a screen the session drives itself (not in a window
# of another session).
# enabled = false
# The temperature at night, in kelvin, from 1500 (very warm) to 6500 (the
# screen's own white).
# temperature = 4000
# from = "21:00"
# to = "07:00"

# [accessibility]
# The screen reader (Orca) starts with the session; it reads the bar, its
# popovers, the notifications, the lock screen and the password dialog
# (docs/design/screen-reader.md). Super+Alt+S starts or stops it anyway.
# screen-reader = false

# [appearance]
# The theme the bar, its menus, the launcher, the lock screen, the
# authentication dialog and the Settings draw in: "dark" or "light"; or
# "frost" (Givre), icy blue on night-blue glass, or "matrix", near-black
# glass with the phosphor green in touches, for the bar, its menus, the
# notifications, the launcher and the lock screen, the Settings and
# applications staying dark. Applications are told too, through the
# desktop portal's org.freedesktop.appearance color-scheme (GTK 4,
# libadwaita, Qt 6.5 and browsers follow it).
# theme = "dark"
# What is chosen, on or focused (switches, the selection, the keyboard's
# ring): "green" (the pandas'), "blue", "violet", "rose", "teal",
# "wallpaper" (its dominant hue), "ice" (Givre's) or "phosphor"
# (Matrix's), which choosing those themes in the Settings sets.
# Applications are told it as the portal's
# accent-color.
# accent = "green"
# How much larger the Settings window draws its text and pieces, from
# 0.8 to 1.5; the bar keeps its sizes.
# text-scale = 1.0
# Windows fade instead of moving, and do not wobble; desktops fade
# instead of sliding; the bar changes its form at once.
# reduced-motion = false
# The focused window's rim is 2 px wide instead of 1; applications are
# told (the portal's contrast).
# high-contrast = false
# The bar is opaque instead of glass over what is behind it.
# reduce-transparency = false
# The cursor theme (an Xcursor theme's directory name, in ~/.local/share/icons,
# ~/.icons, /usr/share/icons…) and the cursor's size in logical pixels, from
# 8 to 256. By default, XCURSOR_THEME's and XCURSOR_SIZE's, else the theme
# named "default" (usually the distribution's, such as Adwaita) at 24.
# Programs the desktop starts are given the same, so that theirs match.
# For example:
#   cursor-theme = "Adwaita"
#   cursor-size = 32
# (an empty cursor-theme is the system's).

# [locale]
# The desktop's own words: "system" (LC_ALL, LC_MESSAGES, LANG), "fr" or
# "en". Programs started afterwards are given it as LANGUAGE.
# language = "system"
# How the bar, the lock screen and the calendar write the date: "long"
# (jeudi 5 novembre), "short" (jeu. 5 nov.), "numeric" (05/11/2026) or
# "iso" (2026-11-05).
# date = "long"
# The time over "24h" (14:05) or "12h" (2:05 PM): the bar's clock, the
# calendar, the next meeting, the reminders, the lock. Unset: the
# session's locale decides (12 hours in en_US and a few others). For
# example:
#   time = "12h"

# [wallpaper]
# Every screen's background: a built-in, "night", "mist", "dawn" or
# "forest"; one that moves, "rain", "stars" or "aurora"; "plain" (the color below);
# or a picture's path (JPEG, PNG or WebP; ~/ is the home). The Settings copy a picture chosen there into
# ~/.local/share/hocuspanda/wallpapers. A picture that does not read draws
# night, and the journal says why.
# picture = "night"
# Each screen its own: [outputs.NAME] wallpaper, else picture. Turned off,
# the screens' own stay in the file for when it is on again.
# per-screen = false
# How a picture of one's own fills its screen: "cover" (what overflows is
# cut), "contain" (the whole picture, the color on its sides) or "center"
# (at its size, the color around it).
# fit = "cover"
# The plain background, and around a picture not covering: #RRGGBB. The
# Settings offer #0b1020, #1b2233, #22324d, #1d3a2e, #3a2a26, #2a2a30.
# color = "#1b2233"
# The lock screen: each screen's wallpaper "dimmed" or "blurred" (never
# the windows), or "picture": lock-picture, dimmed.
# lock = "dimmed"
# lock-picture = "night"
# A wallpaper that moves runs on the GPU at 15 frames a second (rain),
# 20 (stars) or 10 (aurora), on each screen where it shows: it stops under a fullscreen
# window, covered at more than 90 %, locked, off or under the curtain, after
# 2 minutes without input, in the power saver and with reduced motion; the
# glass over it blurs a still picture of it. Turned off, or drawing on the CPU: its still
# picture.
# animate = true
# On battery: "half" its frames (and pace), "still", or "full".
# on-battery = "half"

# [day]
# "Your day" in the bar: meetings from calendar accounts, and tasks from
# a kanban board, else from the list kept on this computer
# (~/.local/state/hocuspanda/tasks.json). Read by the bar as it starts.
# No secret goes here: an account's token is kept in the session's
# keyring, else in ~/.local/state/hocuspanda/accounts/, readable by you
# alone. The bar's "Choisir…" (shown while none is set) writes these
# sections for you, keeping the rest of this file as it is. Each
# account is a section of its own, and the bar's tasks are
# the first tasks' account's. For example, a day from a file (for tests
# and screenshots; its format: docs/design/day.md), read as it changes:
#
#   [[day.calendars]]
#   kind = "fixture"
#   file = "day.toml"                    # beside this file
#   shown = ["Travail"]                  # by name; none: as the account says
#   colors = { "Travail" = "#6CC287" }
#
#   [[day.tasks]]
#   kind = "fixture"
#   file = "day.toml"
#   tasks = "TODO"                       # default TODO, else the first column
#   done = "DONE"                        # default DONE, else the last
#   add = ""                             # where + adds: the tasks' column
#
# A Planka board (kind "planka"): its address, or the server's and the
# board's id; its columns by name. Its token is pasted once in the
# bar's popover, or with `hocus day planka-token` (in Planka, once signed
# in: the browser's tools, Storage, Cookies, accessToken and
# httpOnlyToken):
#
#   [[day.tasks]]
#   kind = "planka"
#   address = "https://planka.example.org/boards/1234"
#   tasks = "TODO"
#   done = "DONE"
#
# Google calendars come from GNOME Online Accounts (add the Google
# account in Settings > Online Accounts, its calendar on): nothing of the
# account is kept here, its token is asked of Online Accounts.
#
#   [[day.calendars]]
#   kind = "google"
#   account = "alex@example.org"         # none: every Google account there
#   shown = ["Travail", "Congés"]
#   featured = ["Travail"]               # the meeting card's, the reminders'
#                                        # and the halo's; none: every shown one
#   colors = { "Travail" = "#6CC287" }

# [calendar]
# A meeting's reminder, a tab beside the bar with Join: at the event's own
# alarm, else this many minutes before its start; 0 keeps only the
# events' own alarms (docs/design/bar.md, Day.6).
# remind = 5
