# Which portal backends xdg-desktop-portal uses in the Hocuspanda session
# (XDG_CURRENT_DESKTOP=Hocuspanda): the desktop's own for sharing the
# screen (docs/design/sharing.md) and for the appearance applications
# follow (the theme, the accent and the contrast, from [appearance]), GTK's
# for the rest (the file chooser, the other settings) when it is
# installed.
[preferred]
default=gtk;
org.freedesktop.impl.portal.ScreenCast=hocuspanda;
org.freedesktop.impl.portal.Settings=hocuspanda;gtk;
