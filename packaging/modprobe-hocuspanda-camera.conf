# The Hocuspanda camera on V4L2 (docs/design/camera.md): one v4l2loopback
# device, labelled "Hocuspanda", which hocus-camera finds by its label and
# writes its frames to, for the applications that read only /dev/video*.
# exclusive_caps: it shows as a camera once written, as browsers want.
options v4l2loopback devices=1 video_nr=42 card_label="Hocuspanda" exclusive_caps=1
