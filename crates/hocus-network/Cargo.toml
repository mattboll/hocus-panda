[package]
name = "hocus-network"
description = "The Hocuspanda network: NetworkManager followed on the system bus and the radios' rfkill, for the bar and the Settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# NetworkManager on the system bus (MIT), on a thread of its own.
zbus = { workspace = true, features = ["tokio", "proxy"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The signals' stream.
futures-util.workspace = true
# What zbus calls take.
serde.workspace = true
tracing.workspace = true
# The radios' device, read whole then waited on (fcntl).
rustix = { workspace = true, features = ["fs"] }
