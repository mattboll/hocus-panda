[package]
name = "hocus-agents"
description = "The agents' states as Hocuspanda follows them: their sources (Claude Code's and Codex's hooks, herdr, the `hocus agent` command), and plugging a tool in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The note an agent's tool gives (what it asks for, why it failed), the
# same on the control socket's line as on the shell's.
hocus-link.workspace = true
# The tools' hooks' payloads, and Claude Code's settings, kept in their
# order when written back.
serde_json = { workspace = true, features = ["preserve_order"] }
# `hocus mcp`'s line to the compositor (docs/design/mcp.md).
serde = { workspace = true, features = ["derive"] }
# Codex's config.toml edited without losing the user's comments and
# layout (MIT or Apache-2.0).
toml_edit.workspace = true
# inotify (tools appearing, their settings changing, herdr's socket),
# poll and eventfd for the watcher's thread.
rustix = { workspace = true, features = ["fs", "event", "process"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
