[package]
name = "hocus-secretary-link"
description = "The private line to the Hocuspanda secretary's process: its versioned protocol, one JSON object per line, for the shell and the `hocus` command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The consent records' times.
jiff = { workspace = true, features = ["std", "serde"] }
tracing.workspace = true
# Online Accounts' Google accounts (`goa`), for her sources and the
# Settings' consent rows; the shell and `hocus` go without.
zbus = { workspace = true, features = ["tokio"], optional = true }
tokio = { workspace = true, features = ["rt", "time"], optional = true }

[features]
goa = ["dep:zbus", "dep:tokio"]

[dev-dependencies]
tempfile.workspace = true
