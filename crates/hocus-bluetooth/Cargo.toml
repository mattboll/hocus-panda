[package]
name = "hocus-bluetooth"
description = "The Hocuspanda Bluetooth: BlueZ followed and asked on the system bus, for the bar and the Settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# BlueZ on the system bus; `service`: the pairing agent, which BlueZ calls.
zbus = { workspace = true, features = ["tokio", "proxy", "service"] }
# What zbus calls take, for a call helper.
serde.workspace = true
# The thread's own runtime, its channels and its timeouts.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# The signals' streams.
futures-util.workspace = true
tracing.workspace = true
