[package]
name = "hocus-compositor"
description = "The Hocuspanda compositor: window management, rendering, input and protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocuspanda"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The configuration written as the Settings write it (#736's switches).
hocus-config = { path = "../hocus-config", version = "1.0.0" }
# The windows' geometry, shared with the Settings' trial area (6.14).
hocus-geometry = { path = "../hocus-geometry", version = "1.0.0" }
hocus-link = { path = "../hocus-link", version = "1.0.0" }
hocus-pandas = { path = "../hocus-pandas", version = "1.0.0" }
hocus-agents = { path = "../hocus-agents", version = "1.0.0" }
# The session's start-up applications (6.15), read as the launcher reads
# desktop entries.
hocus-xdg = { path = "../hocus-xdg", version = "1.0.0" }
anyhow = "1.0.104"
# The same as smithay's, with signals: SIGTERM and SIGINT stop the loop.
calloop = { version = "0.14.5", features = ["signals"] }
clap = { version = "4.6.7", features = ["derive"] }
# The titles of Alt+Tab's panel (MIT, Apache-2.0 or Zlib).
fontdue = "0.9.3"
# The radial menu drawn on the CPU (#723), as the shell's toolkit draws
# there (BSD-3-Clause).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
# The pandas' drawings (#649), the shell's resvg (MIT or Apache-2.0).
resvg = { version = "0.45.1", default-features = false }
# The screen capture (5.8): its PNG, cut and put together off the loop;
# PNG alone of the codecs, as the shell's (MIT or Apache-2.0).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The capture's file names say when, in local time (MIT or Unlicense), as
# the shell's clock reads it.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libloading = "0.8.9"
# The lock's PAM conversation (7.1): the C allocator PAM frees its answers
# with, and the user's account (getpwuid_r).
libc = "0.2.191"
# The lock's password zeroed once checked (MIT or Apache-2.0).
zeroize = "1.9.1"
# Screen sharing's streams (5.11): PipeWire's own bindings (MIT); the
# library itself at run time, its headers to build (libpipewire-0.3-dev).
pipewire = { version = "0.10.1", features = ["v0_3_77"] }
# CLOCK_MONOTONIC's microseconds, systemd's timestamps' clock (#538); the
# recording's sound pipe, a FIFO, and its ffmpeg stopped when it stalls
# (5.10).
rustix = { version = "1.1.6", features = ["fs", "process", "rand", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
# The screens as the Settings read them (6.9), one JSON line each time.
serde_json = "1.0.154"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "renderer_multi",
    "renderer_pixman",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
tempfile = "3.27.0"
# The screen cast portal (5.11), on the session bus, on a thread of its
# own with its runtime, as the shell's D-Bus services.
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Cursor themes' files (MIT).
xcursor = "0.3.11"

[features]
# The lock's test authenticator (7.1, docs/design/lock.md): a password of
# the tests' own instead of PAM. Only this crate's tests turn it on (the
# dev-dependency on itself below); a release build has none of it.
test-auth = []

[dev-dependencies]
hocus-compositor = { path = ".", features = ["test-auth"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31.15"
# text-input-v3 for a test window's text field (the emoji picker, 5.7);
# fractional-scale for what a client on an unplugged screen is told.
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# KDE's server decoration, as Qt and GTK 3 clients use it (#716).
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# X11 test windows, with and without Motif hints, on XWayland (#716).
x11rb = "0.13.2"
# The levels' services faked for the shell: UPower, power-profiles-daemon
# and logind on a private bus; PipeWire's graph read back. BlueZ's object
# manager (`object-manager`) too.
serde_json = "1.0.154"
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }
