[package]
name = "hocus-compositor"
description = "The Hocuspanda compositor: window management, rendering, input and protocols"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocuspanda"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hocus-link = { path = "../hocus-link" }
anyhow = "1.0.104"
# The same as smithay's, with signals: SIGTERM and SIGINT stop the loop.
calloop = { version = "0.14.5", features = ["signals"] }
clap = { version = "4.6.7", features = ["derive"] }
# The titles of Alt+Tab's panel (MIT, Apache-2.0 or Zlib).
fontdue = "0.9.3"
libloading = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "renderer_multi",
    "renderer_pixman",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Cursor themes' files (MIT).
xcursor = "0.3.11"

[dev-dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31.15"
