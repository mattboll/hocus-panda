[package]
name = "hocus-compositor"
description = "The Wayland compositor: smithay glue, backends, input, rendering, XWayland."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
hocus-api = { version = "0.1.0", path = "../hocus-api" }
libloading = "0.8.9"
png = "0.18.1"
serde_json = "1.0.154"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_drm", "renderer_pixman", "wayland_frontend", "desktop"] }
tempfile = "3.27.0"
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }
