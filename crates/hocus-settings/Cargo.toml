[package]
name = "hocus-settings"
description = "The Hocuspanda Settings: an application window that writes the desktop's configuration file so that nobody has to edit it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocus-settings"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The configuration file read, edited in place and written back.
hocus-config.workspace = true
# The mice and touchpads, followed on the desktop's control socket (6.12).
hocus-agents.workspace = true
hocus-link.workspace = true
hocus-pandas.workspace = true
# A panic said in the log before the program ends (#778).
hocus-panic.workspace = true
# The Performances page: the days the compositor recorded, their peaks and
# signals (#655).
hocus-perf.workspace = true
# The trial area's windows move, stick and snap with the compositor's own
# geometry (6.14).
hocus-geometry.workspace = true
# The Son page's PipeWire: followed, set, metered, as the bar does.
hocus-sound.workspace = true
# The Bluetooth page's BlueZ: followed and asked, as the bar does.
hocus-bluetooth.workspace = true
# The Réseau page's NetworkManager and radios, followed and set as the bar
# does (6.6).
hocus-network.workspace = true
# The applications, their icons, the defaults (mimeapps.list) and the
# start-up entries, read as the launcher and the session read them (6.15).
hocus-xdg.workspace = true
# The applications' PNG icons, decoded on the page's thread (6.15); the
# avatars (6.11), a picture cut square and written as PNG (the codecs to
# read one are hocus-link's).
image = { workspace = true, features = ["png"] }
toml_edit.workspace = true
# The shell's toolkit and its settings (tech-choices, decision 2), as an
# application window this time: winit's Wayland backend, no X11, no theme
# detection over D-Bus.
iced = { workspace = true, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "tokio",
    "wayland",
    # Blend in gamma space as browsers do: the mockups are CSS.
    "web-colors",
    # The sections' stroke icons.
    "svg",
    # The places of what it draws, for its log (tests and screen readers).
    "advanced",
    # The screens' drawing and the trial's ring (6.9).
    "canvas",
    # The wallpapers' thumbnails (6.3), drawn by the page's thread.
    "image-without-codecs",
] }
# Its CPU renderer, to draw every frame whole (#662; patched in the
# workspace's manifest). The same crate iced draws with, its features
# iced's.
iced_tiny_skia.workspace = true
# The adapter wgpu offers, to choose the CPU renderer when it is a CPU (as
# the shell does).
wgpu.workspace = true
# The file's changes (inotify on its folder), on its worker; the user's id,
# for their name; `passwd`'s pseudo-terminal (6.11).
rustix = { workspace = true, features = ["fs", "process", "pty", "event", "termios"] }
# The search ignores accents: words decomposed (NFD), their marks left out.
unicode-normalization.workspace = true
# When the last version that read was written, in the user's time zone.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Toasts' and the slider's delays.
tokio = { workspace = true, features = ["time", "rt", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# What it shows, said in its log as JSON (tests).
serde_json.workspace = true
# Raising the window on a second launch: xdg-activation on the connection
# iced's winit drew it on (winit has no focus request on Wayland). The same
# versions as winit's.
wayland-client.workspace = true
wayland-backend.workspace = true
# And keyboard-shortcuts-inhibit while a shortcut is recorded (6.8).
wayland-protocols.workspace = true

# The desktop portal's file chooser (6.3), from the wallpaper page's thread.
zbus = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
