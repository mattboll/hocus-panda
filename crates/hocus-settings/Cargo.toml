[package]
name = "hocus-settings"
description = "The settings app: a Wayland client drawn with hocus-ui, changing the configuration file."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hocus-api = { version = "0.1.0", path = "../hocus-api" }
hocus-core = { version = "0.1.0", path = "../hocus-core" }
hocus-shell = { version = "0.1.0", path = "../hocus-shell" }
hocus-ui = { version = "0.1.0", path = "../hocus-ui" }
rustix = { version = "1.1.5", features = ["event"] }
smithay-client-toolkit = "0.19.2"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }

[dev-dependencies]
png = "0.18.1"
tempfile = "3.27.0"
