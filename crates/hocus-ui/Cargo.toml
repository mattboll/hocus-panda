[package]
name = "hocus-ui"
description = "The shell's widget toolkit: layout, text, theme tokens, springs, hit testing, damage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
parley = { version = "0.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"
vello_cpu = "0.3.0"

[dev-dependencies]
anyhow = "1.0.104"
png = "0.18.1"
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31.15"
