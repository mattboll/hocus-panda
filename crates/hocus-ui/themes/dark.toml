# The panda's black: ink, frosted glass, bamboo.
name = "dark"

[colors]
background = "#0E0F12"
surface = "#1A1C21"
surface_hover = "#24272D"
surface_pressed = "#2C3037"
border = "#FFFFFF14"
text = "#ECEEF0"
muted = "#A3A9B2"
agent = "#B48CFF"
waiting = "#F2A65A"
error = "#F28B7D"
shadow = "#00000066"

# Accent options, tuned for this theme's contrast.
[accents]
default = "bamboo"
bamboo = "#7BC47F"
amber = "#F2A65A"
blue = "#8AB4F8"
pink = "#F28DB2"

[fonts]
interface = "manrope"
display = "fraunces"
mono = "jetbrains-mono"

# Depth: panels over frosted glass, where the compositor can blur what is
# behind them, and shadows under windows.
[effects]
glass = 0.84          # how opaque a panel's surface is over the blur
blur = 32             # how far the blur reaches, logical pixels
window_shadow = 0.5   # windows' shadows at their darkest
