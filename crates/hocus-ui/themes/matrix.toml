# Green rain on black and night blue, all monospace.
name = "matrix"

[colors]
background = "#02040A"
surface = "#040A16"
surface_hover = "#0A1626"
surface_pressed = "#0F1E33"
border = "#00F06047"
text = "#C8FFD4"
muted = "#6BDB86"
agent = "#B48CFF"
waiting = "#E8F060"
error = "#FF7070"
shadow = "#000000AA"

[accents]
default = "bamboo"
bamboo = "#00F060"
amber = "#F2A65A"
blue = "#8AB4F8"
pink = "#F28DB2"

[fonts]
interface = "jetbrains-mono"
display = "jetbrains-mono"
mono = "jetbrains-mono"
