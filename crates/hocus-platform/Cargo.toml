[package]
name = "hocus-platform"
description = "System services behind traits, for Linux and FreeBSD."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
flate2 = "1.1.10"
futures-core = "0.3.32"
serde_json = "1.0.154"
getrandom = "0.3.4"
jiff = "0.2.38"
base64 = "0.22.1"
quick-xml = "0.41.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }
tracing = "0.1.44"
zbus = "6.0.0"
