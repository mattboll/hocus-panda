[package]
name = "hocus-shell"
description = "The Hocuspanda shell: the bar, drawn with iced as a layer-shell client of the compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocuspanda-shell"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hocus-link = { path = "../hocus-link", version = "0.2.0" }
# No x11, no winit-side theme detection: the shell only talks Wayland
# through iced_layershell (tech-choices, spike #315).
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "tokio",
    "wayland",
    # Blend in gamma space as browsers do: the mockups are CSS.
    "web-colors",
    # The clock draws its glyphs in cells, and measures its font.
    "canvas",
    "advanced",
    # Applications' icons in the sound's popover: PNG (the codec below)
    # and SVG.
    "image-without-codecs",
    "svg",
] }
# PNG alone of the image crate's codecs, for the applications' icons.
image = { version = "0.25", default-features = false, features = ["png"] }
# Without its default theme detection (mundy, over the session's D-Bus).
# Pinned: its winit-core prerelease dependencies broke it once (spike).
iced_layershell = { version = "=0.19.1", default-features = false }
# The clock's time zone and its rules, read from the system's database.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# CLOCK_MONOTONIC, the compositor's clock, to start a form switch when it
# does; inotify, to see the time zone change; the user's id, for their name.
rustix = { version = "1.1.6", features = ["time", "fs", "event", "process"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The levels: UPower, power-profiles-daemon and logind on the system bus
# (MIT); the backlight's changes from udev (MIT); PipeWire's graph as
# `pw-dump` writes it, in JSON. `service`: Bluetooth's pairing agent,
# which BlueZ calls.
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy", "service"] }
udev = "0.9.3"
serde_json = "1.0.154"
# What zbus calls take, for a call helper of the network's.
serde = "1.0.229"
# The Wayland connection iced draws on, made here to read the clipboard
# on it (paste); the same version as iced_layershell's.
wayland-client = "0.31.15"
# Its screens' xdg-output names, which iced_layershell finds them by
# (outputs); the same version as iced_layershell's.
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
# The clipboard's history sealed on disk (5.6): XChaCha20-Poly1305
# (RustCrypto, MIT or Apache-2.0); its random keys and nonces.
chacha20poly1305 = "0.11.0"
# The launcher's search ignores accents: names decomposed (NFD), their
# marks left out (MIT or Apache-2.0).
unicode-normalization = "0.1.25"
# The launcher's SVG icons drawn at their size on the icons' thread, not
# on the one that draws: the same resvg as iced's (MIT or Apache-2.0).
resvg = { version = "0.45.1", default-features = false }
# The capture's marks' texts drawn into its image off the shell's thread
# (5.9), in Manrope: the compositor's (MIT, Apache-2.0 or Zlib).
fontdue = "0.9.3"
# The adapter wgpu offers, to choose the CPU renderer when it is a CPU.
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "gles"] }

[dev-dependencies]
tempfile = "3.27.0"
