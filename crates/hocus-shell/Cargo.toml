[package]
name = "hocus-shell"
description = "The Hocuspanda shell: the bar, drawn with iced as a layer-shell client of the compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocuspanda-shell"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hocus-link = { path = "../hocus-link", version = "0.2.0" }
# No x11, no winit-side theme detection: the shell only talks Wayland
# through iced_layershell (tech-choices, spike #315).
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "tokio",
    "wayland",
    # Blend in gamma space as browsers do: the mockups are CSS.
    "web-colors",
    # The clock draws its glyphs in cells, and measures its font.
    "canvas",
    "advanced",
] }
# Without its default theme detection (mundy, over the session's D-Bus).
# Pinned: its winit-core prerelease dependencies broke it once (spike).
iced_layershell = { version = "=0.19.1", default-features = false }
# The clock's time zone and its rules, read from the system's database.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# CLOCK_MONOTONIC, the compositor's clock, to start a form switch when it
# does; inotify, to see the time zone change.
rustix = { version = "1.1.6", features = ["time", "fs", "event"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The levels: UPower, power-profiles-daemon and logind on the system bus
# (MIT); the backlight's changes from udev (MIT); PipeWire's graph as
# `pw-dump` writes it, in JSON.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
udev = "0.9.3"
serde_json = "1.0.154"
# The adapter wgpu offers, to choose the CPU renderer when it is a CPU.
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "gles"] }

[dev-dependencies]
tempfile = "3.27.0"
