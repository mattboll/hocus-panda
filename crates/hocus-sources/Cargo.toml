[package]
name = "hocus-sources"
description = "The secretary's sources, read-only (Google accounts of Online Accounts: calendars, birthdays, Gmail over IMAP), the secrets' first pass and the facts computed in code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# One test program, tests/main.rs: each test file is a module of it (#765).
autotests = false

[lints]
workspace = true

[dependencies]
# The notebooks (pro, perso), one definition with her memory's.
hocus-secretary-link = { workspace = true, features = ["goa"] }
# Online Accounts' tokens, the Calendar API's reader and the day's model.
hocus-day.workspace = true
# Dates, instants and time zones (school holidays are in Paris time).
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo", "serde"] }
serde = { workspace = true, features = ["derive"] }
# Consent records, sync cursors and the school calendar's cache on disk.
serde_json.workspace = true
# The secrets' rules, vendored as data (src/redact/rules.toml).
toml.workspace = true
regex.workspace = true
tracing.workspace = true
# Online Accounts on the bus the process is given.
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "time"] }
# CardDAV (birthdays) and the school calendar's open data, blocking, on a
# source's worker. TLS by rustls on ring, against the system's
# certificates.
ureq.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
# CardDAV's multistatus answers.
quick-xml.workspace = true
# A mail's text part out of its MIME structure; attachments are never kept.
mail-parser.workspace = true
# XOAUTH2's initial response.
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
# Online Accounts faked on a private bus.
zbus = { workspace = true, features = ["tokio", "proxy", "service", "object-manager"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[test]]
name = "main"
path = "tests/main.rs"
