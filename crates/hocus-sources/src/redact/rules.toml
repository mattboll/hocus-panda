# The secrets' first pass: known token formats (docs/design/secretary.md
# §14.1). Data, not code: a change here re-runs the secrets corpus
# (tests/secrets_corpus.rs) and bumps `version`.
#
# The formats are adapted from gitleaks' default configuration
# (https://github.com/gitleaks/gitleaks, config/gitleaks.toml), under the
# MIT licence:
#
#   MIT License
#
#   Copyright (c) 2019 Zachary Rice
#
#   Permission is hereby granted, free of charge, to any person obtaining a
#   copy of this software and associated documentation files (the
#   "Software"), to deal in the Software without restriction, including
#   without limitation the rights to use, copy, modify, merge, publish,
#   distribute, sublicense, and/or sell copies of the Software, and to
#   permit persons to whom the Software is furnished to do so, subject to
#   the following conditions:
#
#   The above copyright notice and this permission notice shall be included
#   in all copies or substantial portions of the Software.
#
#   THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS
#   OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF
#   MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.
#   IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY
#   CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT,
#   TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE
#   SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
#
# Each rule: an `id`, a `regex` (Rust's `regex` syntax, RE2's), and
# `secret`, the group that is the secret (0: the whole match). Rules are
# matched as is (case-sensitive unless the regex says `(?i)`).

version = 1

[[rule]]
id = "github-pat"
regex = '''\bgh[pousr]_[0-9A-Za-z]{36}\b'''

[[rule]]
id = "github-fine-grained-pat"
regex = '''\bgithub_pat_[0-9A-Za-z_]{82}\b'''

[[rule]]
id = "gitlab-pat"
regex = '''\bglpat-[0-9A-Za-z_\-]{20}\b'''

[[rule]]
id = "gitlab-other-tokens"
regex = '''\bgl(?:ptt|dt|rt|cbt|imt|oas|soat|ft|agent)-[0-9A-Za-z_\-]{20,}\b'''

[[rule]]
id = "slack-token"
regex = '''\bxox[abposr]-[0-9A-Za-z\-]{10,}\b'''

[[rule]]
id = "slack-app-token"
regex = '''(?i)\bxapp-\d-[A-Z0-9]+-\d+-[a-z0-9]+\b'''

[[rule]]
id = "slack-webhook"
regex = '''https://hooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{30,}'''

[[rule]]
id = "aws-access-key"
regex = '''\b(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'''

[[rule]]
id = "aws-secret-key"
regex = '''(?i)aws_?(?:secret)?_?(?:access)?_?key["']?\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})\b'''
secret = 1

[[rule]]
id = "google-api-key"
regex = '''\bAIza[0-9A-Za-z_\-]{35}\b'''

[[rule]]
id = "google-oauth-token"
regex = '''\bya29\.[0-9A-Za-z_\-]{20,}'''

[[rule]]
id = "stripe-key"
regex = '''\b(?:sk|rk|pk)_(?:test|live|prod)_[0-9A-Za-z]{10,99}\b'''

[[rule]]
id = "anthropic-key"
regex = '''\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_\-]{80,}'''

[[rule]]
id = "openai-key"
regex = '''\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{20,}T3BlbkFJ[A-Za-z0-9_\-]{20,}\b'''

[[rule]]
id = "generic-sk-key"
regex = '''\bsk-[A-Za-z0-9]{32,}\b'''

[[rule]]
id = "npm-token"
regex = '''\bnpm_[A-Za-z0-9]{36}\b'''

[[rule]]
id = "pypi-token"
regex = '''\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_\-]{50,}'''

[[rule]]
id = "digitalocean-token"
regex = '''\bdo[opr]_v1_[a-f0-9]{64}\b'''

[[rule]]
id = "sendgrid-key"
regex = '''\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b'''

[[rule]]
id = "twilio-key"
regex = '''\bSK[0-9a-fA-F]{32}\b'''

[[rule]]
id = "telegram-bot-token"
regex = '''\b\d{8,10}:AA[0-9A-Za-z_\-]{33}\b'''

[[rule]]
id = "discord-token"
regex = '''\b[MN][A-Za-z\d]{23,25}\.[\w\-]{6}\.[\w\-]{27,38}\b'''

[[rule]]
id = "heroku-key"
regex = '''(?i)heroku[a-z_ \-]{0,20}["']?\s*[:=]\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secret = 1

[[rule]]
id = "jwt"
regex = '''\beyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'''

[[rule]]
id = "private-key"
regex = '''(?s)-----BEGIN[ A-Z0-9_]*PRIVATE KEY(?: BLOCK)?-----.*?(?:-----END[ A-Z0-9_]*PRIVATE KEY(?: BLOCK)?-----|\z)'''

[[rule]]
id = "basic-auth-url"
regex = '''\b[a-z][a-z0-9+.\-]*://[^\s:/@]+:([^\s:/@]+)@'''
secret = 1

[[rule]]
id = "generic-api-key"
regex = '''(?i)\b(?:api[_\-]?key|apikey|api[_\-]?secret|client[_\-]?secret|access[_\-]?token|auth[_\-]?token|secret[_\-]?key|private[_\-]?key|bearer)["']?\s*(?:[:=]|=>)?\s*["']?([A-Za-z0-9_\-+/.=]{16,})'''
secret = 1

[[rule]]
id = "secret-query-parameter"
regex = '''(?i)[?&](?:token|access_token|api_key|apikey|key|secret|sig|signature|password|pwd|code|otp)=([^&\s#"'>]{6,})'''
secret = 1
