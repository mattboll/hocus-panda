# The secrets corpus (docs/design/secretary.md AC50): sentences with a
# secret hidden in natural language, and tricky ones without any. Every
# value is made up; card numbers, IBANs and social security numbers are
# built to pass their keys, and belong to no one.
#
# `secret`: `text` and the `secrets` it holds (each must be gone once
# masked); `clean`: `text` that must come out unchanged.
#
# `{{}}` is taken out before use: it keeps the made-up tokens from being
# taken for real ones by a forge's secret scanning.

