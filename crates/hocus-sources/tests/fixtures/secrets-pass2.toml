# The second pass's answers over the secrets corpus (AC50), as the local
# triage model gives them in its schema's `secrets` (the secret's exact
# characters and its kind; code finds them and masks them). The detector
# is shown each sentence after the first pass, as the triage is.
#
# SCRIPTED, NOT MEASURED: these answers were written by hand, for CI, to
# exercise the second pass's path (quotes found in the masked text, masked
# in every field, counted) without a model. They are not a model's
# quality. On the bench machine (machine), a run of the real local model
# over the corpus replaces this file with its recorded answers; the test
# then reports the measured recall. A sentence with no entry: the
# detector found nothing in it.

[[answer]]
sentence = "Le code alarme c'est un-deux-trois-quatre"
secrets = [{ text = "un-deux-trois-quatre", kind = "alarm-code" }]

[[answer]]
sentence = "Entre 4417 sur le clavier en bas et pousse fort."
secrets = [{ text = "4417", kind = "door-code" }]

[[answer]]
sentence = "Le cadenas du casier, c'est 908."
secrets = [{ text = "908", kind = "code" }]

[[answer]]
sentence = "Le mot de passe de la Freebox, c'est le nom du chat suivi de 1987 : Minou1987"
secrets = [{ text = "Minou1987", kind = "password" }]

# A detector over-flags too: a build number taken for a code. Its false
# positives are reported, not hidden.
[[answer]]
sentence = "Le build #4821 a échoué."
secrets = [{ text = "4821", kind = "code" }]

# What the first pass already masked is not shown to the detector: a
# quote of it finds nothing to mask and changes nothing.
[[answer]]
sentence = "mdp du wifi : chienchat"
secrets = [{ text = "chienchat", kind = "wifi-password" }]
