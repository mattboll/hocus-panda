[package]
name = "hocus-day"
description = "Your day's data for the Hocuspanda bar: calendars, events and tasks from sources behind adapters, read off the loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Times: instants, dates and the system's time zones; serde for the cache.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# The cache and the local list on disk.
serde_json = "1.0.154"
# The configuration's `[day]` and the fixture's file.
toml = "1.1.8"
tracing = "0.1.44"
# The fixture's file watched for changes (inotify), its worker asleep
# meanwhile.
rustix = { version = "1.1.6", features = ["fs"] }
# The accounts' tokens in the session's Secret Service, on a thread that
# waits for it with a timeout (as the clipboard's key, 5.6).
zbus = { version = "6.0.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
anyhow = "1.0.104"
