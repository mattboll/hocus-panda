[package]
name = "hocus-day"
description = "Your day's data for the Hocuspanda bar: calendars, events and tasks from sources behind adapters, read off the loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# One test program, tests/main.rs: each test file is a module of it (#765).
autotests = false

[lints]
workspace = true

[dependencies]
# The configuration file read and written back in place, as the Settings
# do.
hocus-config.workspace = true
# Its files' errors, by what went wrong (MIT or Apache-2.0).
thiserror.workspace = true
# Times: instants, dates and the system's time zones; serde for the cache.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo", "serde"] }
serde = { workspace = true, features = ["derive"] }
# The cache and the local list on disk.
serde_json.workspace = true
# The configuration's `[day]` and the fixture's file.
toml.workspace = true
# Day.1's choices written into the configuration file, its other sections,
# comments and order kept.
toml_edit.workspace = true
tracing.workspace = true
# The fixture's file watched for changes (inotify), its worker asleep
# meanwhile.
rustix = { workspace = true, features = ["fs"] }
# The accounts' tokens in the session's Secret Service, on a thread that
# waits for it with a timeout (as the clipboard's key, 5.6).
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "time"] }
# Kanban servers' and Google Calendar's REST APIs (Planka, Google),
# blocking, on their accounts' workers. TLS by rustls on ring, against the
# system's certificates (the platform's verifier): no bundled roots.
ureq.workspace = true
rustls.workspace = true

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
# Online Accounts faked on a private bus, for the Google tests.
zbus = { workspace = true, features = ["tokio", "proxy", "service", "object-manager"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[test]]
name = "main"
path = "tests/main.rs"
