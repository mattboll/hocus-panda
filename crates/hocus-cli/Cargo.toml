[package]
name = "hocus-cli"
description = "The `hocus` command: tells the Hocuspanda desktop what an agent is doing, and keeps the tokens of your day's accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocus"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hocus-agents = { path = "../hocus-agents", version = "0.2.0" }
# `hocus day planka-token`: a board's token kept where the shell reads it.
hocus-day = { path = "../hocus-day", version = "0.2.0" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
anyhow = "1.0.104"
