[package]
name = "hocus-cli"
description = "The `hocus` command: tells the Hocuspanda desktop what an agent is doing, and keeps the tokens of your day's accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocus"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hocus-agents.workspace = true
# `hocus day planka-token`: a board's token kept where the shell reads it.
hocus-day.workspace = true
# `hocus perf day`: a day of the desktop's CPU and memory (#655).
hocus-perf.workspace = true
# `hocus msg secretary`: her socket's protocol.
hocus-secretary-link.workspace = true
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo"] }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
