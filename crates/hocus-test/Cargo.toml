[package]
name = "hocus-test"
description = "Scenario runner, test clients and screenshot comparison."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hocus-api = { version = "0.1.0", path = "../hocus-api" }
hocus-compositor = { version = "0.1.0", path = "../hocus-compositor" }
hocus-ui = { version = "0.1.0", path = "../hocus-ui" }
png = "0.18.1"
rustix = { version = "1.1.5", features = ["event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.19.2", default-features = false }
tempfile = "3.27.0"
toml = "1.1.8"
wayland-client = "0.31.15"
x11rb = "0.13.2"
zbus = "6.0.0"

[dev-dependencies]
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
libtest-mimic = "0.8.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[test]]
name = "scenarios"
harness = false
