[package]
name = "hocus-test"
description = "Scenario runner, test clients and screenshot comparison."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-core = "0.3.32"
hocus-api = { version = "0.1.0", path = "../hocus-api" }
hocus-platform = { version = "0.1.0", path = "../hocus-platform" }
hocus-compositor = { version = "0.1.0", path = "../hocus-compositor" }
hocus-settings = { version = "0.1.0", path = "../hocus-settings" }
hocus-annotate = { version = "0.1.0", path = "../hocus-annotate" }
hocus-shell = { version = "0.1.0", path = "../hocus-shell" }
hocus-ui = { version = "0.1.0", path = "../hocus-ui" }
png = "0.18.1"
rustix = { version = "1.1.5", features = ["event", "fs", "pipe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.19.2", default-features = false }
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "0.1.44"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = "0.13.2"
zbus = "6.0.0"

[dev-dependencies]
jiff = "0.2.38"
libtest-mimic = "0.8.2"
tracing-subscriber = "0.3.23"

[[test]]
name = "scenarios"
harness = false
