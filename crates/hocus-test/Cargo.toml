[package]
name = "hocus-test"
description = "Scenario runner, test clients and screenshot comparison."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hocus-api = { version = "0.1.0", path = "../hocus-api" }
hocus-compositor = { version = "0.1.0", path = "../hocus-compositor" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
toml = "1.1.8"
wayland-client = "0.31.15"

[dev-dependencies]
libtest-mimic = "0.8.2"
tempfile = "3.27.0"

[[test]]
name = "scenarios"
harness = false
