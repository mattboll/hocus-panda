[package]
name = "hocus-link"
description = "The private line between the Hocuspanda compositor and its shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The clipboard's clips on a line (5.6), text and images alike (MIT or
# Apache-2.0).
base64.workspace = true
# The messages, one JSON object per line (both MIT or Apache-2.0).
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# A picture's errors, by what went wrong (MIT or Apache-2.0).
thiserror.workspace = true
# The wallpapers' pictures (6.3), decoded off the loop by the compositor,
# the shell and the Settings alike: JPEG, PNG and WebP (MIT or Apache-2.0).
image = { workspace = true, features = ["jpeg", "png", "webp"] }
