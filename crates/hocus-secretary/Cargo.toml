[package]
name = "hocus-secretary"
description = "The Hocuspanda secretary's process: her memory (a temporal graph in an encrypted SQLite), her audit log, her sources' bookkeeping, and her private socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hocus-secretary"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hocus-secretary-link = { workspace = true, features = ["goa"] }
# Her memory: one SQLite database, encrypted page by page by SQLCipher
# (BSD-3-Clause; SQLite's public-domain blessing; decision 0004), built
# from source against the system's libcrypto, FTS5 included.
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The fake model's script and the fixture sources' files.
toml.workspace = true
# Valid and recorded times: instants and civil dates.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo", "serde"] }
# Her memory's key: 32 random bytes.
getrandom.workspace = true
# Her memory's key in the session's Secret Service, on the bus the
# compositor names, on a thread that waits for it with a timeout.
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "time"] }
# How long the machine slept: CLOCK_BOOTTIME against CLOCK_MONOTONIC; a
# key typed on a terminal without its echo; her files watched (inotify).
rustix = { workspace = true, features = ["time", "termios", "fs"] }
# Names and aliases folded: accents and case.
unicode-normalization.workspace = true
# What the user teaches her, read in code (rules, arrivals, departures).
regex.workspace = true
# Her sources (Google accounts of Online Accounts), redacted before
# anything else sees them: one Notebook with her memory's.
hocus-sources.workspace = true
# An event's times, as the sources give them.
hocus-day.workspace = true
# The models' HTTP (the Anthropic Messages API, OpenAI-compatible local
# servers), blocking, on a call's worker thread; TLS by rustls on ring
# against the system's certificates, as the sources do.
ureq.workspace = true
rustls.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
# A fake Secret Service and a fake Online Accounts on a private bus.
zbus = { workspace = true, features = ["tokio", "proxy", "service", "object-manager"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
# A terminal for `hocus-secretary key` (its prompt, its echo off).
rustix = { workspace = true, features = ["time", "termios", "fs", "pty"] }
# The sources' fakes (a fake IMAP server's XOAUTH2), shared with
# hocus-sources' tests.
base64.workspace = true
