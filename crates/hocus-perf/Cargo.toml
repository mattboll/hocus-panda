[package]
name = "hocus-perf"
description = "A day of the Hocuspanda desktop's CPU and memory: sampled every 10 s off the compositor's loop, kept 14 days, read back with its peaks and signals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The day's file is the user's day: named by the local date, its times read
# in the local zone.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The clock's ticks and the page's size, to read /proc in milliseconds and
# kilobytes.
rustix = { workspace = true, features = ["param"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
