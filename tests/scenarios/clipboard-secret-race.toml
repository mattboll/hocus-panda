description = "A password manager taking the clipboard right after another copy: the history never reads the secret, even when it asks for the copy before once the secret is in place"
outputs = ["1280x800"]
shell = true

[[step]]
open = { app_id = "editor", size = [400, 300], color = "#3366cc" }

[[step]]
copy = { app_id = "editor", text = "first copy" }

# Both in one go: the compositor gets them in the same turn.
[[step]]
copy = { app_id = "editor", text = "copied just before", then_secret = "hunter2" }

[[step]]
keys = "super+v"

[[step]]
expect_ui = { label = "first copy" }

[[step]]
expect_ui = { label = "hunter2", shown = false }
