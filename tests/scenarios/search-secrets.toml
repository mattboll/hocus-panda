# Document search never reads secrets (#45, docs/robustness.md): a searched
# folder holds .ssh (a key, notes), a project's .env and a certificate's key,
# all made unreadable as well; the indexer opens none of them (an attempt
# would count as unreadable), finds nothing in them, and a folder named in
# the configuration inside one of them is not searched either.
description = "Nothing under .ssh, no .env and no key file is opened or found, even when the configuration names .ssh itself"
outputs = ["1280x800"]
shell = true
home = "../fixtures/search-home"

[[step]]
unreadable = "{home}/Documents/.ssh/id_ed25519"

[[step]]
unreadable = "{home}/Documents/.ssh"

[[step]]
unreadable = "{home}/Documents/project/.env"

[[step]]
unreadable = "{home}/Documents/project/server.pem"

[[step]]
config = """
[search]
folders = ["{home}/Documents"]
"""

# Three entries never read, and not one attempt that failed.
[[step]]
expect_search = { state = "ready", documents = 7, never_read = 3, unreadable = 0 }

[[step]]
pointer_move = [700, 400]

[[step]]
keys = "super+space"

[[step]]
type = "bamboo"

[[step]]
expect_ui = { label = "plan.md, in project: Plan the bamboo nursery." }

[[step]]
expect_ui = { label = "notes.txt", shown = false }

[[step]]
expect_ui = { label = "id_ed25519", shown = false }

[[step]]
expect_ui = { label = "server.pem", shown = false }

[[step]]
keys = "escape"

# The configuration cannot open them: named as folders, they are not
# searched.
[[step]]
config = """
[search]
folders = ["{home}/Documents/.ssh", "{home}/Documents/project/.env"]
"""

[[step]]
expect_search = { state = "ready", documents = 0, never_read = 2, unreadable = 0 }
