description = "Alt+drag moves a window by exactly the pointer's travel, and the client sees no button"
outputs = ["1280x800"]

[[step]]
open = { app_id = "doc", size = [400, 300], color = "#33cc66" }

[[step]]
pointer_move = [600, 400]

[[step]]
key_down = "alt"

[[step]]
press = "left"

[[step]]
pointer_move = [650, 400]

[[step]]
pointer_move = [700, 400]

[[step]]
release = "left"

[[step]]
key_up = "alt"

[[step]]
expect_window = { app_id = "doc", geometry = [540, 250, 400, 300], focused = true }

[[step]]
expect_not_received = { app_id = "doc", event = "button 272 pressed" }

[[step]]
expect_not_received = { app_id = "doc", event = "button 272 released" }
