description = "An invalid configuration file is refused with its line and key, and the previous one stays"
outputs = ["1280x800"]

[[step]]
config = """
[windows.gaps]
outer = 16
"""

[[step]]
open = { app_id = "doc", size = [400, 300], color = "#33cc66" }

[[step]]
set_state = { app_id = "doc", state = "maximized" }

[[step]]
expect_window = { app_id = "doc", geometry = [16, 16, 1248, 768] }

[[step]]
config = """
[windows.gaps]
outer = "big"
"""

[[step]]
expect_config_error = "line 2"

[[step]]
expect_config_error = "outer"

# Still the gaps of the last good file.
[[step]]
expect_window = { app_id = "doc", geometry = [16, 16, 1248, 768] }
