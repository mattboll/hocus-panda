description = "A maximized window resists a little, then leaves maximize under the pointer"
outputs = ["1280x800"]

[[step]]
open = { app_id = "doc", size = [400, 300], color = "#33cc66" }

[[step]]
set_state = { app_id = "doc", state = "maximized" }

[[step]]
expect_window = { app_id = "doc", geometry = [0, 0, 1280, 800], state = "maximized" }

[[step]]
pointer_move = [640, 10]

[[step]]
key_down = "alt"

[[step]]
press = "left"

# A small pull: nothing moves.
[[step]]
pointer_move = [650, 20]

[[step]]
expect_window = { app_id = "doc", geometry = [0, 0, 1280, 800], state = "maximized" }

[[step]]
pointer_move = [700, 200]

[[step]]
release = "left"

[[step]]
key_up = "alt"

# Back to its own size, held at the same share of its width.
[[step]]
expect_window = { app_id = "doc", geometry = [500, 190, 400, 300], state = "normal" }
