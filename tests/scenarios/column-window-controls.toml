description = "The column's buttons minimize, maximize and close the active window"
outputs = ["1280x800"]
shell = true

[[step]]
config = """
[panel]
form = "column"
"""

[[step]]
open = { app_id = "notes", size = [400, 300], color = "#f2a65a" }

[[step]]
open = { app_id = "editor", size = [400, 300], color = "#3399ff" }

[[step]]
expect_ui = { label = "Close", disabled = false }

[[step]]
click_ui = "Maximize"

[[step]]
expect_window = { app_id = "editor", state = "maximized", focused = true }

# The same button now restores.
[[step]]
click_ui = "Restore"

[[step]]
expect_window = { app_id = "editor", state = "normal" }

[[step]]
click_ui = "Minimize"

[[step]]
expect_window = { app_id = "editor", state = "minimized" }

[[step]]
expect_focus = "notes"

[[step]]
click_ui = "Close"

[[step]]
expect_received = { app_id = "notes", event = "close" }

[[step]]
expect_no_window = "notes"

# Nothing left to act on: the buttons are shown, disabled.
[[step]]
expect_ui = { label = "Close", disabled = true }
