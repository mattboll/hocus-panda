description = "A rule puts a see-through window over the blur of what is behind it, computed again only when that changes"
renderer = "gles"
shell = true

[[step]]
config = """
[[rules]]
app_id = "glassy"
opacity = 0.8
blur = true
"""

[[step]]
wait_wallpapers = true

[[step]]
frames = 2

[[step]]
expect_blur = {}

[[step]]
open = { app_id = "glassy", size = [400, 300], color = "#202024" }

[[step]]
frames = 2

[[step]]
expect_blur = { at_least = 1 }

[[step]]
expect_idle = { for_ms = 1000 }

[[step]]
expect_blur = { at_most = 0 }

# Another window over it: in front of the glass, nothing to blur again.
[[step]]
open = { app_id = "other", size = [300, 200], color = "#33cc66" }

[[step]]
frames = 2

[[step]]
expect_blur = { at_most = 0 }
