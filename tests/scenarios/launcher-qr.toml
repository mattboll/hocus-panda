description = "\"qr hello\" and Enter show a QR code of hello over the screen; Escape closes it"
outputs = ["1280x800"]
shell = true

[[step]]
open = { app_id = "editor", size = [400, 300], color = "#3399ff" }

[[step]]
keys = "super+space"

[[step]]
type = "qr hello"

[[step]]
expect_ui = { label = "Show a QR code of “hello”", selected = true }

[[step]]
key = 28

[[step]]
expect_ui = { label = "QR: hello" }

[[step]]
frames = 1

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "launcher-qr.png" }

[[step]]
keys = "escape"

[[step]]
expect_ui = { label = "QR: hello", shown = false }

[[step]]
expect_window = { app_id = "editor", focused = true }
