# The lock's moments (#48): our lock screen fades in over the desktop it
# hides, and when unlocked parts from the centre on it.
description = "The lock screen fades in over the desktop, and unlocked parts from the centre"
outputs = ["1280x800"]
shell = true
motion = true

[[step]]
open = { app_id = "editor", size = [500, 400], color = "#3399ff" }

[[step]]
advance_ms = 500

[[step]]
keys = "super+l"

[[step]]
expect_ui = { label = "Password" }

# Half way in: the window shows through.
[[step]]
advance_ms = 100

[[step]]
frames = 1

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "lock-entering.png" }

[[step]]
advance_ms = 400

[[step]]
expect_idle = { for_ms = 1000 }

[[step]]
type = "panda"

[[step]]
keys = "enter"

[[step]]
expect_ui = { label = "Password", shown = false }

# Parting: the desktop in the middle, the halves going.
[[step]]
advance_ms = 200

[[step]]
frames = 1

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "unlock-parting.png" }

[[step]]
advance_ms = 400

[[step]]
expect_idle = { for_ms = 1000 }

[[step]]
expect_focus = "editor"
