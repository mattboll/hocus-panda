# Account and updates (#67): the name through AccountsService and the
# fingerprints through fprintd, stand-ins on a private system bus; how often
# updates are looked for.
description = "Account: the full name AccountsService says, changed there and said back; the fingerprint reader's finger; updates looked for once a day; in the dark and light themes"
outputs = ["1280x800"]
shell = true
accounts = true

[[step]]
config = """
[panel]
form = "column"
"""

[[step]]
open_settings = { page = "account" }

[[step]]
expect_settings = { label = "Panda Touch · 1 finger enrolled" }

[[step]]
expect_settings = { label = "Alex · Hocuspanda 0.1.0" }

[[step]]
click_settings = "Full name"

[[step]]
keys = "backspace"

[[step]]
keys = "backspace"

[[step]]
keys = "backspace"

[[step]]
keys = "backspace"

[[step]]
keys = "backspace"

[[step]]
type = "P."

[[step]]
keys = "enter"

[[step]]
expect_accounts = "SetRealName Alex P."

[[step]]
expect_settings = { label = "Alex P." }

[[step]]
pointer_move = [500, 500]

[[step]]
scroll = 600

[[step]]
click_settings = "Look every: 1 day"

[[step]]
expect_config_file = { contains = ["[updates]", "every_hours = 24"] }

[[step]]
expect_settings = { label = "Look every: 1 day", selected = true }

[[step]]
pointer_move = [330, 760]

[[step]]
scroll = -600

[[step]]
frames = 2

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "settings-account.png" }

[[step]]
config = """
[appearance]
theme = "light"

[updates]
every_hours = 24

[panel]
form = "column"
"""

[[step]]
frames = 2

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "settings-account-light.png" }
