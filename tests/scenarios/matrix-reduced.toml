description = "In the Matrix theme with reduced motion, a window opening only fades in, shortly, with no glyphs"
outputs = ["1280x800"]
shell = true
motion = true

[[step]]
config = """
[appearance]
theme = "matrix"
reduced_motion = true

[panel]
form = "column"
"""

[[step]]
wait_wallpapers = true

[[step]]
open = { app_id = "editor", size = [600, 400], color = "#3399ff" }

[[step]]
advance_ms = 66

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "matrix-reduced.png" }

[[step]]
advance_ms = 100

[[step]]
expect_idle = { for_ms = 2000 }
