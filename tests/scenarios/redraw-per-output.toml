[[step]]
expect_window = { app_id = "redraw.w20", output = "HEADLESS-1", visible = true }

# A window on the wide screen too, then another theme: every screen draws
# it, the windows' hairline in its tint.
[[step]]
pointer_move = [2900, 700]
[[step]]
open = { app_id = "redraw.w21", size = [480, 320], color = "#3399ff" }
[[step]]
advance_ms = 1000
[[step]]
measure = true
[[step]]
config = """
[appearance]
theme = "light"

[panel]
form = "column"
"""
[[step]]
expect_frames = { for_ms = 500, at_least = 1 }
[[step]]
# Once each.
expect_cost = { frames = [1, 1], renders = [1, 1] }
