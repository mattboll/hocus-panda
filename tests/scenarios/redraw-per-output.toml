description = "A change redraws only the screens it shows on (#244): twenty windows opening on the first screen build no scene on the second, a theme change redraws every screen"
# The scenarios' two screens: a laptop panel at scale 2, a wide screen.
outputs = ["2560x1600@2", "3440x1440"]
shell = true
motion = true

[[step]]
config = """
[appearance]
theme = "dark"

[panel]
form = "column"
"""

