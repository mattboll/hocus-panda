# Circle to ask (#46) with the AI on: the menu offers Explain first, Search,
# Translate, Copy the text, Note and a question field. Explain asks the
# local model (a stand-in on 127.0.0.1) about the circled text; its answer
# streams into the card beside the loop. Escape closes it all.
description = "With the AI on, Explain asks the model about the circled text and the answer streams into a card beside the loop; Escape closes the loop, the menu and the card"
outputs = ["1280x800"]
shell = true

[[step]]
config = """
[panel]
form = "column"
"""

[[step]]
ai_server = { delay_ms = 30, pieces = [
  "The header linux/input.h does not exist on FreeBSD.\n\n",
  "The input module includes a Linux header directly. On FreeBSD the key codes ",
  "come from evdev-proto, installed apart, under another path.\n\n",
  "```sh\npkg install evdev-proto\n# then include dev/evdev/input.h\n```\n",
] }

[[step]]
config = """
[screenshots]
ocr = "{scenario_dir}/circle/bin/ocr"

[ai]
enabled = true
provider = "ollama"
url = "{ai}"

[panel]
form = "column"
"""

[[step]]
open = { app_id = "log", size = [900, 560], color = "#15171b" }

[[step]]
pointer_move = [140, 313]

[[step]]
key_down = "super"

[[step]]
key_down = "shift"

[[step]]
press = "left"

[[step]]
pointer_path = [[140, 313], [134, 340], [178, 365], [267, 384], [383, 393], [508, 392], [619, 380], [697, 359], [730, 333], [710, 307], [642, 285], [538, 270], [414, 266], [294, 273], [197, 290], [158, 314], [151, 339], [193, 363]]

[[step]]
release = "left"

[[step]]
key_up = "shift"

[[step]]
key_up = "super"

[[step]]
expect_ui = { label = "Explain", inside = [306, 400, 424, 180] }

[[step]]
expect_ui = { label = "Ask something else about the circled area" }

[[step]]
frames = 1

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "circle-explain.menu.png" }

[[step]]
click_ui = "Explain"

[[step]]
expect_ui = { label = "The header linux/input.h does not exist on FreeBSD." }

[[step]]
expect_ui = { label = "Copy" }

[[step]]
expect_ai = { path = "/api/chat", contains = ["Explain it in English", "fatal error: 'linux/input.h' file not found"] }

[[step]]
advance_ms = 300

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "circle-explain.png" }

[[step]]
expect_budget = { max_ms = 100 }

[[step]]
key = 1

[[step]]
expect_ui = { label = "Explain", shown = false }

[[step]]
expect_ui = { label = "Copy", shown = false }

[[step]]
frames = 1

[[step]]
expect_pixel = { output = "HEADLESS-1", at = [430, 266], color = "#15171b", tolerance = 8 }
