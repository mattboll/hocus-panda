description = "Unplugging keeps the external output's windows in sight; plugging it back returns them"
outputs = ["1280x800", "1920x1080"]

[[step]]
open = { app_id = "chat", size = [500, 300], color = "#3399ff" }

[[step]]
pointer_move = [1800, 500]

[[step]]
open = { app_id = "doc", size = [400, 300], color = "#33cc66" }

[[step]]
expect_window = { app_id = "doc", output = "HEADLESS-2", geometry = [2040, 390, 400, 300], focused = true }

[[step]]
unplug = "HEADLESS-2"

# Same offset from the laptop's corner, above the laptop's window, focused.
[[step]]
expect_window = { app_id = "doc", output = "HEADLESS-1", geometry = [760, 390, 400, 300], visible = true, focused = true }

[[step]]
expect_stack = ["chat", "doc"]

[[step]]
frames = 1

[[step]]
expect_screenshot = { output = "HEADLESS-1", reference = "unplug-and-replug.unplugged.png" }

[[step]]
plug = { spec = "1920x1080+1280+0", name = "HEADLESS-2" }

[[step]]
expect_window = { app_id = "doc", output = "HEADLESS-2", geometry = [2040, 390, 400, 300], visible = true }

[[step]]
expect_window = { app_id = "chat", output = "HEADLESS-1", geometry = [390, 250, 500, 300], visible = true }

[[step]]
frames = 1

[[step]]
expect_screenshot = { output = "HEADLESS-2", reference = "unplug-and-replug.replugged.png" }
