description = "Locked, a screen plugged shows its own lock and nothing of the desktop, even in a capture of it"
outputs = ["1280x800"]
shell = true

[[step]]
open = { app_id = "mail", size = [600, 400], color = "#3399ff" }

[[step]]
keys = "super+38"

[[step]]
expect_ui = { label = "Password" }

[[step]]
plug = { spec = "1920x1080+1280+0" }

[[step]]
frames = 2

[[step]]
expect_screenshot = { output = "HEADLESS-2", reference = "lock-hotplug.png" }
