# Circle to ask (#46) while the text is read: what is chosen before it is
# there waits for it, said under the menu; an area with no text says so.
description = "An action chosen while the circled text is still read waits for it under a note, then acts; an area with no text says so under the menu"
outputs = ["1280x800"]
shell = true

[[step]]
config = """
[screenshots]
ocr = "{scenario_dir}/circle/bin/ocr-slow"
"""

[[step]]
open = { app_id = "log", size = [900, 560], color = "#15171b" }

[[step]]
pointer_move = [140, 313]

[[step]]
key_down = "super"

[[step]]
key_down = "shift"

[[step]]
press = "left"

[[step]]
pointer_path = [[140, 313], [134, 340], [178, 365], [267, 384], [383, 393], [508, 392], [619, 380], [697, 359], [730, 333], [710, 307], [642, 285], [538, 270], [414, 266], [294, 273], [197, 290], [158, 314], [151, 339], [193, 363]]

[[step]]
release = "left"

[[step]]
key_up = "shift"

[[step]]
key_up = "super"

[[step]]
click_ui = "Copy the text"

[[step]]
expect_ui = { label = "Reading the text…" }

[[step]]
expect_clipboard = { app_id = "log", text = "fatal error: 'linux/input.h' file not found" }

[[step]]
expect_ui = { label = "Copy the text", shown = false }

[[step]]
config = """
[screenshots]
ocr = "{scenario_dir}/circle/bin/ocr-blank"
"""

[[step]]
pointer_move = [140, 313]

[[step]]
key_down = "super"

[[step]]
key_down = "shift"

[[step]]
press = "left"

[[step]]
pointer_path = [[140, 313], [134, 340], [178, 365], [267, 384], [383, 393], [508, 392], [619, 380], [697, 359], [730, 333], [710, 307], [642, 285], [538, 270], [414, 266], [294, 273], [197, 290], [158, 314], [151, 339], [193, 363]]

[[step]]
release = "left"

[[step]]
key_up = "shift"

[[step]]
key_up = "super"

[[step]]
expect_ui = { label = "No text found in the circled area" }

[[step]]
click_ui = "Note"

[[step]]
expect_ui = { label = "Note" }

[[step]]
key = 1

[[step]]
expect_ui = { label = "Note", shown = false }
