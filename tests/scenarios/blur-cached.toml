description = "The blur behind the column is computed once over a still scene, again only when what is behind it changes, and not at all with transparency off"
renderer = "gles"
shell = true

[[step]]
config = """
[panel]
form = "column"
"""

[[step]]
open = { app_id = "doc", size = [400, 300], color = "#3399ff" }

[[step]]
wait_wallpapers = true

[[step]]
frames = 2

[[step]]
expect_blur = { at_least = 1 }

# The pointer over the column, its buttons lit: frames in front of the
# glass, nothing behind it changes.
[[step]]
pointer_move = [1100, 300]

[[step]]
pointer_move = [1120, 330]

[[step]]
frames = 3

[[step]]
expect_blur = { at_most = 0 }

# At rest, no frame, no blur.
[[step]]
expect_idle = { for_ms = 1000 }

# A window moved under the column: what is behind it changed.
[[step]]
pointer_move = [600, 400]

[[step]]
key_down = "alt"

[[step]]
press = "left"

[[step]]
pointer_move = [800, 400]

[[step]]
pointer_move = [1000, 400]

[[step]]
release = "left"

[[step]]
key_up = "alt"

[[step]]
frames = 2

[[step]]
expect_blur = { at_least = 1 }

[[step]]
expect_idle = { for_ms = 1000 }

[[step]]
expect_blur = { at_most = 0 }

# Reduced motion: solid panels too, as with transparency off below.
[[step]]
config = """
[appearance]
reduced_motion = true

[panel]
form = "column"
"""

[[step]]
frames = 2

[[step]]
expect_blur = { at_most = 0 }

# Transparency off: solid panels, nothing blurred, whatever moves.
[[step]]
config = """
[appearance]
transparency = false

[panel]
form = "column"
"""

[[step]]
frames = 2

[[step]]
expect_blur = { at_most = 0 }

[[step]]
key_down = "alt"

[[step]]
press = "left"

[[step]]
pointer_move = [900, 400]

[[step]]
release = "left"

[[step]]
key_up = "alt"

[[step]]
frames = 2

[[step]]
expect_blur = { at_most = 0 }
