description = "Twenty windows open on two screens and their desktops switch, within budgets counted rather than timed: frames, scenes built, allocations on the loop and memory held (#88)"
# The scenarios' two screens: a laptop panel at scale 2, a wide screen.
outputs = ["2560x1600@2", "3440x1440"]
shell = true
motion = true

[[step]]
config = """
[panel]
form = "column"
"""

[[step]]
wait_wallpapers = true
[[step]]
advance_ms = 1000
[[step]]
measure = true

[[step]]
open = { app_id = "budget.w01", size = [480, 320], color = "#3399ff" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w02", size = [540, 360], color = "#ff6633" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w03", size = [600, 400], color = "#33cc66" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w04", size = [660, 440], color = "#cc33aa" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w05", size = [720, 320], color = "#ffcc00" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w06", size = [480, 360], color = "#00cccc" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w07", size = [540, 400], color = "#9966ff" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w08", size = [600, 440], color = "#ff3366" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w09", size = [660, 320], color = "#66cc33" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w10", size = [720, 360], color = "#3366cc" }
[[step]]
advance_ms = 300

# The next ten on the wide screen.
[[step]]
pointer_move = [2900, 700]

[[step]]
open = { app_id = "budget.w11", size = [480, 400], color = "#3399ff" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w12", size = [540, 440], color = "#ff6633" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w13", size = [600, 320], color = "#33cc66" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w14", size = [660, 360], color = "#cc33aa" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w15", size = [720, 400], color = "#ffcc00" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w16", size = [480, 440], color = "#00cccc" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w17", size = [540, 320], color = "#9966ff" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w18", size = [600, 360], color = "#ff3366" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w19", size = [660, 400], color = "#66cc33" }
[[step]]
advance_ms = 300

[[step]]
open = { app_id = "budget.w20", size = [720, 440], color = "#3366cc" }
[[step]]
advance_ms = 300

[[step]]
# Measured: frames [160, 150], scenes [320, 320], 180,600 allocations,
# 376 MB asked for (the dock's picture made again for each new app), 9.1 MB
# held; budgets 10 % above, held 15 %. Since windows' shadows are drawn at
# the screen's pixels and left out of the window (#261): 189,900
# allocations, 362 MB, 9.5 MB held. Since a redraw names the screens it
# concerns (#244), each screen builds its scenes for its own windows alone:
# scenes [170, 160] (from [320, 320]), 176,400 allocations (from 193,600),
# 289 MB (from 374).
expect_cost = { frames = [176, 165], renders = [187, 176], allocations = 194_000, allocated_mb = 318, held_mb = 10.5 }

# Each screen to its second desktop and back, the pointer on it.
[[step]]
pointer_move = [640, 400]

[[step]]
keys = "super+2"
[[step]]
advance_ms = 1000

[[step]]
keys = "super+3"
[[step]]
advance_ms = 1000

[[step]]
keys = "super+1"
[[step]]
advance_ms = 1000

[[step]]
pointer_move = [2900, 700]

[[step]]
keys = "super+2"
[[step]]
advance_ms = 1000

[[step]]
keys = "super+3"
[[step]]
advance_ms = 1000

[[step]]
keys = "super+1"
[[step]]
advance_ms = 1000

[[step]]
# Measured: frames [23, 21], scenes [102, 102], 59,950 allocations,
# 91 MB, 0.9 MB held (since #261: 61,400 allocations, 96 MB). Since the
# compositor draws panels' shadows (#281), the shadows of the panels the
# switches show are kept, as windows' are, for the next switch: three
# textures, 0.85 MB more held, once (1.8 MB). Since #244, a switch builds
# the scenes of its own screen, and of the other where the focus goes:
# scenes [53, 52] (from [102, 102]), 53,700 allocations (from 62,700),
# 49 MB (from 101), 1.9 MB.
expect_cost = { frames = [26, 24], renders = [58, 57], allocations = 59_000, allocated_mb = 54, held_mb = 2.1 }
[[step]]
expect_shown = { output = "HEADLESS-2", desktop = 1 }
[[step]]
expect_window = { app_id = "budget.w20", output = "HEADLESS-2", visible = true }
# At rest with twenty windows, a minute: nothing drawn but the column's
# clock turning, nothing held.
[[step]]
advance_ms = 60000
[[step]]
# Measured: 274,700 allocations (38 a turn of the loop, two a frame), 8.5 MB.
# Since #244 the minute builds the column's screen alone: scenes [1, 0]
# (from [1, 1]), 267,500 allocations (267,600 before).
expect_cost = { frames = [1, 0], renders = [1, 0], allocations = 294_000, allocated_mb = 10, held_mb = 0.25 }
