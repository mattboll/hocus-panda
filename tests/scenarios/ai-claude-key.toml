# AI providers (#44): Claude's key comes from the keyring (a sealed file in
# tests: never the developer's keyring), never the configuration. Without
# it, the field says the provider refused; with it, the answer streams.
description = "Claude is asked with the key kept by \"hocus msg ai-key\"; without one, the field says it was refused and how to set it"
outputs = ["1280x800"]
shell = true

[[step]]
ai_server = { delay_ms = 10, pieces = ["Forty", "-two."] }

[[step]]
config = """
[ai]
provider = "claude"
url = "{ai}"
"""

[[step]]
pointer_move = [700, 400]

[[step]]
keys = "super+space"

[[step]]
type = "what is the answer?"

[[step]]
expect_ui = { label = "Ask “what is the answer?”", selected = true }

[[step]]
key = 28

[[step]]
expect_ui = { label = "The provider refused the key (no key in the keyring). Set it with “hocus msg ai-key”." }

[[step]]
expect_ui = { label = "Ask again" }

[[step]]
ai_key = { provider = "claude", key = "sk-test-panda" }

[[step]]
key = 28

[[step]]
expect_ui = { label = "Forty-two." }

[[step]]
expect_ai = { path = "/v1/messages", header = "x-api-key: sk-test-panda", contains = ["claude-opus-5-5", "what is the answer?"] }

[[step]]
expect_ui = { label = "ANSWER · CLAUDE · 0 S" }

[[step]]
expect_state_file = { name = "ai-secrets", lacks = ["sk-test-panda"] }
