# A screen turned off and on again (the configuration, then a screen tool):
# its desktops and windows come back (#28).
description = "A screen turned off comes back with its desktops and windows"
outputs = ["1280x800", "1920x1080"]

[[step]]
open = { app_id = "away", size = [400, 300], color = "#33cc66" }

[[step]]
send = { app_id = "away", output = "HEADLESS-2" }

[[step]]
expect_window = { app_id = "away", output = "HEADLESS-2", visible = true }

[[step]]
config = """
[[outputs]]
name = "HEADLESS-2"
enabled = false
"""

[[step]]
expect_output = { name = "HEADLESS-2", shown = false }

# Meanwhile on the screen still on.
[[step]]
expect_window = { app_id = "away", output = "HEADLESS-1", visible = true }

[[step]]
expect_event = { type = "output_removed", has = "HEADLESS-2" }

[[step]]
config = """
[[outputs]]
name = "HEADLESS-2"
enabled = true
"""

[[step]]
expect_output = { name = "HEADLESS-2", geometry = [1280, 0, 1920, 1080] }

[[step]]
expect_window = { app_id = "away", output = "HEADLESS-2" }

[[step]]
randr = { output = "HEADLESS-2", enabled = false }

[[step]]
expect_output = { name = "HEADLESS-2", shown = false }

[[step]]
randr = { output = "HEADLESS-2", enabled = true }

[[step]]
expect_window = { app_id = "away", output = "HEADLESS-2" }
