description = "A wrong password: the account says why it did not sync, and nothing is shown"
outputs = ["1280x800"]
shell = true

[[step]]
config = """
[panel]
form = "column"
"""

[[step]]
caldav = { dir = "calendar/work", user = "alex", password = "panda" }

[[step]]
config = """
[[calendars]]
name = "Work"
url = "{caldav}"
user = "alex"

[panel]
form = "column"
"""

[[step]]
calendar_password = { id = "alex@{caldav}", password = "bamboo" }

[[step]]
expect_calendars = { events = 0, secrets = 1, error = true }

[[step]]
expect_ui = { label = "Nothing else planned" }

[[step]]
open_settings = { page = "accounts" }

[[step]]
expect_settings = { label = "The server refused the user name or password" }
