name: Weekly

# What no push checks: the tests with smithay's debug assertions on.
# Cargo.toml turns them off (`[profile.dev.package.smithay]`), because a
# client can trip some of them and end a debug session; they also say when
# the compositor itself misuses smithay, which is worth hearing about once
# a week. A scheduled workflow runs on the default branch only.
on:
  schedule:
    # Mondays, 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  smithay-debug-assertions:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - name: Dependencies
        # Those of ci.yml's `build` and `linux`, together.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            clang mold pkg-config fonts-dejavu-core \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev \
            dbus pipewire pipewire-bin wireplumber libpipewire-0.3-dev ffmpeg \
            mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: smithay's debug assertions on
        # A profile's per-package settings cannot be given by an environment
        # variable (cargo reads those from files and `--config` only), so:
        # cargo's own configuration file, which wins over Cargo.toml's
        # profile for every cargo run of this job, nextest's too.
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package.smithay]\ndebug-assertions = true\n' \
            >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - name: Disk freed
        run: |
          while pgrep -x rm > /dev/null; do sleep 2; done
          df -h /
      - name: Programs
        run: cargo build --locked -p hocus-shell -p hocus-cli -p hocus-settings
      - name: Tests
        run: cargo nextest run --locked --profile ci --workspace --no-fail-fast
