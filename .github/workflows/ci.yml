name: CI

on:
  pull_request:
  push:
    branches: [main]
  # FreeBSD, every night.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config gdb xwayland dbus libnotify-bin grim fontconfig fonts-ipafont-gothic fonts-noto-color-emoji \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev libpam0g-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        # --no-tests=pass until the first tests land.
        run: cargo nextest run --workspace --no-tests=pass
      - name: Keep test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: target/test-artifacts/
          if-no-files-found: ignore

  freebsd:
    # Pull requests wait for Linux only (#141): FreeBSD builds everything in
    # a VM, and runs on main after each merge, every night, and on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The VM's registry and build, copied back after each run and given
      # to the next.
      - uses: actions/cache@v4
        with:
          path: freebsd-cache
          key: freebsd-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            freebsd-${{ hashFiles('Cargo.lock') }}-
            freebsd-
      - name: Build and test on FreeBSD 14
        uses: vmactions/freebsd-vm@v1
        env:
          CARGO_HOME: ${{ github.workspace }}/freebsd-cache/cargo
          CARGO_TARGET_DIR: ${{ github.workspace }}/freebsd-cache/target
          # Line tables only: a smaller cache, a faster build.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        with:
          # The newest 14.x release.
          release: "14"
          envs: "CARGO_HOME CARGO_TARGET_DIR CARGO_PROFILE_DEV_DEBUG"
          copyback: true
          usesh: true
          prepare: |
            pkg install -y curl pkgconf wayland libxkbcommon pixman mesa-libs libdrm \
              libinput seatd libudev-devd
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          run: |
            export PATH="$CARGO_HOME/bin:$PATH"
            cargo build --workspace --all-targets
            cargo test --workspace
