name: CI

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2, 'sprint/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info made target/ outgrow the runner's disk (run 41709913523,
  # "No space left on device" during the tests). Line tables keep file and
  # line in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A pull request runs the tests of what it changes (scripts/ci/pr-tests.sh):
  # building and running the whole suite took 15 min and more, and a test
  # failing by chance anywhere held every pull request.
  # Whether a pull request runs everything (a harness, the lock file, the
  # label `full-tests`…): then it runs as main does, in `build` and the four
  # `linux` jobs, not in one job (that took 53 min, #650).
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        env:
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-tests') && 'full' || '' }}
        run: scripts/ci/pr-tests.sh --plan HEAD^1 $FULL

  pr-tests:
    needs: plan
    if: needs.plan.outputs.full == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and main before it: what the pull request changes.
          fetch-depth: 2
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-pr-v1-${{ runner.os }}
      - name: Dependencies
        # Those of `build` and of `linux` below, together.
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            clang mold pkg-config fonts-dejavu-core \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev \
            dbus pipewire pipewire-bin wireplumber libpipewire-0.3-dev libssl-dev ffmpeg \
            mesa-vulkan-drivers libvulkan1
          sudo chown -R "$USER" ~/apt-archives
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Tests of what changed
        # A line `Tests: NAME, NAME` in the description adds test files.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/ci/pr-tests.sh HEAD^1

  # On main, after each merge, the whole suite: every Rust build happens once,
  # in `build`; four `linux (N/4)` jobs then run a quarter of the tests each
  # from its nextest archive (#633). Nobody waits on it; a failure is fixed
  # at once.
  build:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.plan.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The runner's image ships toolchains this build never uses. They are
        # removed while the packages install; the build waits for it.
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - name: Build dependencies
        # What smithay and the session need to build. D-Bus and PipeWire:
        # the bar's levels are tested against private ones, and screen
        # sharing streams to one (its library's headers to build).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            clang mold pkg-config \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev \
            libpipewire-0.3-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved by main's build; a pull request's tests start from it.
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Disk freed
        run: |
          while pgrep -x rm > /dev/null; do sleep 2; done
          df -h /
      - name: Programs
        # The compositor's tests start the real shell and Settings, and run
        # `hocus`, from beside them: a test binary does not build them. The
        # archive takes them along (.config/nextest.toml).
        run: cargo build -p hocus-shell -p hocus-cli -p hocus-settings -p hocus-secretary
      - name: Tests' archive
        run: cargo nextest archive --workspace --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest
          path: nextest.tar.zst
          retention-days: 1
          # zstd already.
          compression-level: 0

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            clang mold pkg-config \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev \
            libpipewire-0.3-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  linux:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: linux (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          # The packages' files, so a slow mirror does not hold the tests
          # (it once took 40 min). apt still checks for newer versions.
          path: ~/apt-archives
          key: apt-run-v1-${{ runner.os }}
      - name: Run dependencies
        # The libraries the programs link to (their -dev packages bring
        # them), and what the tests run: private D-Bus and PipeWire,
        # ffmpeg (screen recordings are encoded by it, and their tests
        # decode the files with it), Mesa's Vulkan drivers (lavapipe, on
        # the CPU, for the one test of the shell on wgpu, annotate.rs,
        # #594), and a font.
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            fonts-dejavu-core zstd \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev \
            dbus pipewire pipewire-bin wireplumber libpipewire-0.3-dev libssl-dev ffmpeg \
            mesa-vulkan-drivers libvulkan1
          sudo chown -R "$USER" ~/apt-archives
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest
      - name: The programs are in the archive
        # Without them the tests that need them skip, and would pass.
        run: |
          zstd -dc nextest.tar.zst | tar -t > archive.txt
          for program in hocuspanda-shell hocus hocus-settings hocus-secretary; do
            grep -qE "/debug/$program\$" archive.txt || { echo "::error::$program is not in the archive"; exit 1; }
          done
      - name: Sources older than the programs
        # The tests check that the programs were built from the sources as
        # they are (none newer than each, by its NAME.d list), and this
        # checkout is newer than the build's. Only those sources are made
        # older: a test may read its other files' times.
        run: |
          zstd -dc nextest.tar.zst | tar -xO --wildcards '*/debug/hocuspanda-shell.d' '*/debug/hocus.d' '*/debug/hocus-settings.d' '*/debug/hocus-secretary.d' \
            | sed 's/^[^:]*: //; s/\\ /\x00/g' | tr ' ' '\n' | tr '\000' ' ' \
            | grep -F "$PWD/" | sort -u > sources.txt
          wc -l sources.txt
          tr '\n' '\000' < sources.txt | xargs -0 touch -c -d '2000-01-01T00:00:00Z'
      - name: Tests
        # Extracted into this checkout's target/, where the build put them:
        # a test may name a program by the path it was built at
        # (`CARGO_BIN_EXE_hocus`, fixed at compile time).
        run: >
          cargo nextest run --profile ci --archive-file nextest.tar.zst --workspace-remap .
          --extract-to . --extract-overwrite
          --partition count:${{ matrix.shard }}/4
