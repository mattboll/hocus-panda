name: CI

on:
  pull_request:
    branches: [main, v2]
  push:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info made target/ outgrow the runner's disk (run 41709913523,
  # "No space left on device" during the tests). Line tables keep file and
  # line in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  linux:
    # The tests run in four shards at once: the run takes about a third of
    # the time it took in one job, and every test still runs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: linux (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The runner's image ships toolchains this build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build dependencies
        # What smithay and the session need from slice 1 on: installed now
        # so that adding them to the code changes nothing here. D-Bus and
        # PipeWire: the bar's levels are tested against private ones, and
        # screen sharing streams to one (its library's headers to build).
        # ffmpeg: screen recordings are encoded by it, and their tests
        # decode the files with it. Mesa's Vulkan drivers: lavapipe, on the
        # CPU, for the one test of the shell on wgpu (annotate.rs, #594).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            clang mold pkg-config fonts-dejavu-core \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev \
            libxkbcommon-dev libwayland-dev libegl-dev libgles-dev libpixman-1-dev \
            dbus pipewire pipewire-bin wireplumber libpipewire-0.3-dev ffmpeg \
            mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the four shards, saved by the first on main.
          shared-key: linux
          save-if: ${{ matrix.shard == 1 && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy
        if: matrix.shard == 1
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shell
        # The compositor's tests start the real shell and Settings, and run `hocus`,
        # from beside them: a test binary does not build them, and those
        # tests skip without them.
        run: cargo build -p hocus-shell -p hocus-cli -p hocus-settings
      - name: Tests
        run: cargo nextest run --workspace --partition count:${{ matrix.shard }}/4
