[workspace]
resolver = "3"
members = ["crates/*"]
# Patched copies of dependencies, built as dependencies only.
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mattboll/hocus-panda"

[workspace.lints.rust]
# FFI crates allow it locally, with a SAFETY comment on every block.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
# Keep debug builds usable: the compositor draws every frame.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# smithay checks some of what clients send with `debug_assert!`, such as a
# `wl_region.add` of negative height that foot sends: in a debug build, any
# client could end the session (first build, #260). Built without them,
# debug builds and tests take what a release takes.
[profile.dev.package.smithay]
opt-level = 3
debug-assertions = false

# The shell's CPU renderer presents transparent buffers (vendor/softbuffer/PATCHED.md).
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
