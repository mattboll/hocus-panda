[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mattboll/hocus-panda"

[workspace.lints.rust]
# FFI crates allow it locally, with a SAFETY comment on every block.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
# Keep debug builds usable: the compositor draws every frame.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# smithay checks some of what clients send with `debug_assert!`, such as a
# `wl_region.add` of negative height: in a debug build, any client could end
# the session (#260). Built without them, debug builds and tests take what a
# release takes. Its other debug checks go too: sizes we build ourselves
# (the scenarios check what windows are asked and drawn instead), and the
# winit backend's GL debug context.
[profile.dev.package.smithay]
opt-level = 3
debug-assertions = false
